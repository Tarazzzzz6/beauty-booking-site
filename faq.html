    salon_cta_t: "Vous êtes un salon ou un spécialiste ?",
    salon_cta_p: "Voyez la page complète pour les entreprises : 5 étapes d'inscription, toutes les fonctionnalités, une comparaison honnête avec Fresha et des règles sans petits caractères.",
    salon_cta_b: "Page pour les salons →",
    ft_home: "Annuaire",
    ft_biz: "Pour les salons",
    ft_join: "Ajouter un salon",
    ft_faq: "FAQ",
    ft_terms: "Conditions",
    ft_cab: "Espace salon"
  }
  };

  function renderList(id, items){
    var box = document.getElementById(id);
    box.innerHTML = "";
    (items || []).forEach(function(qa){
      var d = document.createElement("details"); d.className = "faq";
      var s = document.createElement("summary"); s.textContent = qa[0];
      var a = document.createElement("div"); a.className = "a"; a.textContent = qa[1];
      d.appendChild(s); d.appendChild(a); box.appendChild(d);
    });
  }
  function applyLang(lang){
    if(!T[lang]) lang = "uk";
    document.documentElement.lang = lang === "uk" ? "uk" : lang;
    try{ localStorage.setItem("bb_lang", lang); }catch(e){}
    document.querySelectorAll("[data-t]").forEach(function(el){
      var k = el.getAttribute("data-t"); var v = T[lang][k];
      if(typeof v === "string") el.innerHTML = v;
    });
    document.querySelectorAll(".langs button").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-lang") === lang);
    });
    renderList("clientFaq", T[lang].clientFaq);
    renderList("salonFaq", T[lang].salonFaq);
  }
  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){ applyLang(b.getAttribute("data-lang")); });
  });
  var startLang = "uk";
  try{ startLang = localStorage.getItem("bb_lang") || "uk"; }catch(e){}
  applyLang(startLang);
  </script>
</body>
</html>
