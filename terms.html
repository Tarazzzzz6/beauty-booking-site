    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Arial;color:var(--text);background:radial-gradient(1200px 800px at 15% 0%, rgba(201,169,106,.15), transparent 55%),radial-gradient(900px 700px at 85% 10%, rgba(201,169,106,.15), transparent 55%),linear-gradient(180deg,var(--bg),var(--bg2))}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:var(--max);margin:0 auto;padding:22px 18px 90px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .back{display:inline-flex;gap:10px;align-items:center;padding:10px 14px;border-radius:999px;border:1px solid var(--stroke);background:var(--card);font-weight:700}
    .langs{display:flex;gap:6px}
    .langs button{border:1px solid var(--stroke);background:var(--card);color:var(--muted);border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer;font:inherit;font-size:13px}
    .langs button.on{color:#0b0b0f;background:linear-gradient(135deg,var(--gold),var(--pink));border-color:transparent}
    h1{font-family:"Playfair Display",serif;font-size:38px;line-height:1.08;margin:26px 0 10px}
    h1 span{background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
    h2{font-family:"Playfair Display",serif;font-size:24px;margin:34px 0 8px}
    .lead,.sec p,.sec li{color:var(--muted);line-height:1.7}
    .lead{font-size:16.5px;max-width:62ch}
    .sec p{margin:0 0 10px}
    .sec ul{margin:0 0 8px;padding-left:20px}
    .sec li{padding:3px 0}
    .sec b{color:var(--text)}
    .card{border:1px solid var(--stroke);background:var(--card);border-radius:var(--r);padding:20px;margin-top:14px}

  function renderSections(lang){
    var box = document.getElementById("sections");
    box.innerHTML = "";
    (T[lang].sections || []).forEach(function(sec){
      var wrap = document.createElement("div"); wrap.className = "sec";
      var h = document.createElement("h2"); h.textContent = sec[0]; wrap.appendChild(h);
      (sec[1] || []).forEach(function(p){
        var el = document.createElement("p"); el.innerHTML = p; wrap.appendChild(el);
      });
      box.appendChild(wrap);
    });
  }
  function applyLang(lang){
    if(!T[lang]) lang = "uk";
    document.documentElement.lang = lang === "uk" ? "uk" : lang;
    try{ localStorage.setItem("bb_lang", lang); }catch(e){}
    document.querySelectorAll("[data-t]").forEach(function(el){
      var k = el.getAttribute("data-t"); var v = T[lang][k];
      if(typeof v === "string") el.innerHTML = v;
    });
    document.querySelectorAll(".langs button").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-lang") === lang);
    });
    renderSections(lang);
  }
  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){ applyLang(b.getAttribute("data-lang")); });
  });
  var startLang = "uk";
  try{ startLang = localStorage.getItem("bb_lang") || "uk"; }catch(e){}
  applyLang(startLang);
  </script>
</body>
