  function renderSections(lang){
    var box = document.getElementById("sections");
    box.innerHTML = "";
    (T[lang].sections || []).forEach(function(sec){
      var wrap = document.createElement("div"); wrap.className = "sec";
      var h = document.createElement("h2"); h.textContent = sec[0]; wrap.appendChild(h);
      (sec[1] || []).forEach(function(p){
        var el = document.createElement("p"); el.innerHTML = p; wrap.appendChild(el);
      });
      box.appendChild(wrap);
    });
  }
  function applyLang(lang){
    if(!T[lang]) lang = "uk";
    document.documentElement.lang = lang === "uk" ? "uk" : lang;
    try{ localStorage.setItem("bb_lang", lang); }catch(e){}
    document.querySelectorAll("[data-t]").forEach(function(el){
      var k = el.getAttribute("data-t"); var v = T[lang][k];
      if(typeof v === "string") el.innerHTML = v;
    });
    document.querySelectorAll(".langs button").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-lang") === lang);
    });
    renderSections(lang);
  }
  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){ applyLang(b.getAttribute("data-lang")); });
  });
  var startLang = "uk";
  try{ startLang = localStorage.getItem("bb_lang") || "uk"; }catch(e){}
  applyLang(startLang);
