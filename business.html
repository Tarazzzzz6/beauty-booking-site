  <style>
    :root{--bg:#07070b;--bg2:#0b0b11;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.09);--stroke:rgba(255,255,255,.10);--text:#f4f3f8;--muted:rgba(244,243,248,.68);--pink:#C6A15B;--gold:#ffd27a;--violet:#8a6d35;--ok:#20e3a5;--r:22px;--r2:28px;--shadow:0 22px 70px rgba(0,0,0,.55);--max:1100px}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Arial;color:var(--text);background:radial-gradient(1200px 800px at 15% 0%, rgba(201,169,106,.15), transparent 55%),radial-gradient(900px 700px at 85% 10%, rgba(201,169,106,.15), transparent 55%),linear-gradient(180deg,var(--bg),var(--bg2))}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:var(--max);margin:0 auto;padding:22px 18px 90px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .back{display:inline-flex;gap:10px;align-items:center;padding:10px 14px;border-radius:999px;border:1px solid var(--stroke);background:var(--card);font-weight:700}
    .langs{display:flex;gap:6px}
    .langs button{border:1px solid var(--stroke);background:var(--card);color:var(--muted);border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer;font:inherit;font-size:13px}
    .langs button.on{color:#0b0b0f;background:linear-gradient(135deg,var(--gold),var(--pink));border-color:transparent}
    h1{font-family:"Playfair Display",serif;font-size:42px;line-height:1.05;letter-spacing:-.5px;margin:26px 0 12px}
    h1 span{background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
    .lead{color:var(--muted);font-size:17px;max-width:62ch;line-height:1.55}
    .btn{display:inline-flex;align-items:center;gap:10px;border:0;color:#0b0b0f;background:linear-gradient(135deg,var(--pink),var(--violet));border-radius:14px;padding:14px 18px;font-weight:800;cursor:pointer;font-size:16px}
    .btn.gold{background:linear-gradient(135deg,var(--gold),var(--pink))}
    .btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--stroke)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}
    .stat{border:1px solid var(--stroke);background:var(--card);border-radius:var(--r);padding:18px}
    .stat b{font-size:26px;display:block}
    .stat span{color:var(--muted);font-size:13px}
    h2{font-family:"Playfair Display",serif;font-size:28px;margin:42px 0 8px}
    .note{color:var(--muted);margin:0 0 16px;line-height:1.55}
    .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
    .step{border:1px solid var(--stroke);background:var(--card);border-radius:var(--r);padding:18px}
    .step .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#0b0b0f;background:linear-gradient(135deg,var(--gold),var(--pink));margin-bottom:12px}
    .step b{display:block;margin-bottom:6px;font-size:15px}
    .step p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}
    .feats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .feat{border:1px solid var(--stroke);background:var(--card);border-radius:var(--r);padding:18px}
    .feat .ic{font-size:24px;margin-bottom:8px}
    .feat b{display:block;margin-bottom:5px;font-size:15px}
    .feat p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .tier{border:1px solid var(--stroke);background:var(--card);border-radius:var(--r2);padding:22px;position:relative;display:flex;flex-direction:column}
    .tier.hot{border-color:rgba(255,210,122,.45);background:linear-gradient(180deg, rgba(255,210,122,.10), var(--card));box-shadow:0 18px 60px rgba(255,210,122,.10)}
    .badge{position:absolute;top:14px;right:14px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:rgba(255,210,122,.14);border:1px solid rgba(255,210,122,.35);color:var(--gold)}
    .tier h3{margin:0 0 4px;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
    .price{font-size:36px;font-weight:800;margin:8px 0 2px}
    .price small{font-size:14px;color:var(--muted);font-weight:600}
    .price s{color:var(--muted);font-size:19px;font-weight:600}
    .per{color:var(--muted);font-size:13px;line-height:1.5}
    ul.tick{list-style:none;padding:0;margin:14px 0 20px;line-height:1.5}
    ul.tick li{padding:6px 0;color:rgba(244,243,248,.88)} ul.tick li::before{content:"✓ ";color:var(--ok);font-weight:900}
    ul.tick li.no{color:var(--muted)} ul.tick li.no::before{content:"— ";color:var(--muted)}
    .tier .btn{margin-top:auto;justify-content:center}
    table.cmp{width:100%;border-collapse:collapse;border:1px solid var(--stroke);border-radius:var(--r);overflow:hidden;background:var(--card);font-size:14.5px}
    table.cmp th,table.cmp td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--stroke);line-height:1.5;vertical-align:top}
    table.cmp th{background:rgba(255,255,255,.05);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
    table.cmp tr:last-child td{border-bottom:0}
    table.cmp td.us{color:var(--gold);font-weight:700}
    .faq{border:1px solid var(--stroke);background:var(--card);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
    .faq summary{cursor:pointer;padding:17px 18px;font-weight:800;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
    .faq summary::-webkit-details-marker{display:none}
    .faq summary::after{content:"+";color:var(--gold);font-size:20px;font-weight:900}
    .faq[open ] summary::after{content:"−"}
    .faq .a{padding:0 18px 17px;color:var(--muted);line-height:1.6}
    .rules{border:1px solid var(--stroke);background:var(--card);border-radius:var(--r2);padding:24px}
    .rules ol{margin:0;padding-left:20px;line-height:1.65;color:rgba(244,243,248,.9)}
    .rules li{padding:5px 0}
    .rules li b{color:var(--text)}
    .cta{margin-top:38px;border-radius:var(--r2);border:1px solid rgba(255,210,122,.3);background:linear-gradient(135deg, rgba(255,210,122,.10), rgba(201,169,106,.10));padding:26px;text-align:center}
    footer{margin-top:44px;border-top:1px solid var(--stroke);padding-top:22px;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;color:var(--muted);font-size:13.5px;line-height:1.7}
    footer nav{display:flex;gap:16px;flex-wrap:wrap}
    footer a{font-weight:700;color:rgba(244,243,248,.85)}
    @media(max-width:960px){.steps{grid-template-columns:repeat(2,1fr)}.feats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:860px){.grid,.stats{grid-template-columns:1fr} h1{font-size:32px} .steps,.feats{grid-template-columns:1fr} table.cmp{font-size:13px}}
    html{scroll-behavior:smooth}
    body{animation:luxPageIn .7s cubic-bezier(.16,1,.3,1) both}
    @keyframes luxPageIn{from{opacity:0} to{opacity:1}}
    h1{animation:luxHeroIn 1s cubic-bezier(.16,1,.3,1) both}
    @keyframes luxHeroIn{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
    .lux-reveal{opacity:0; transform:translateY(26px); transition:opacity .85s cubic-bezier(.16,1,.3,1), transform .85s cubic-bezier(.16,1,.3,1)}
    .lux-reveal.lux-in{opacity:1; transform:none}
    .tier,.step,.feat{transition:transform .3s cubic-bezier(.16,1,.3,1), border-color .3s, box-shadow .3s}
    .tier:hover,.step:hover,.feat:hover{transform:translateY(-4px); border-color:rgba(255,210,122,.4)}
    .btn{position:relative; overflow:hidden}
    .btn::after{content:""; position:absolute; inset:-40%; background:linear-gradient(100deg, transparent 40%, rgba(255,255,255,.35) 50%, transparent 60%); transform:translateX(-70%); transition:transform .8s ease; pointer-events:none}
    .btn:hover::after{transform:translateX(70%)}
    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important}
      .lux-reveal{opacity:1 !important; transform:none !important}
    }
  </style>
</head>

    faq_h: "Questions des salons",
    faq: [["Comment s'inscrire ?", "Le plus rapide — via le bot @pershe1012_bot : commande /join, 10 minutes, photos depuis le téléphone. Ou le formulaire sur la page « Ajouter un salon ». L'équipe Booking Club vérifie la demande et la publie — habituellement le jour même."], ["Combien ça coûte et quand paie-t-on ?", "Start — 0 $ pour toujours. Partner — premier mois à 0 $, ensuite 30 $ CAD/mois (prix verrouillé pour les premiers salons; le prix régulier sera de 49 $). Premium Top — premier mois à 0 $, ensuite 60 $ CAD/mois. Vous ne payez qu'à partir du deuxième mois et seulement si vous restez sur un tarif payant."], ["Y a-t-il une commission sur les réservations ?", "Non. 0 % — sur les nouveaux clients, sur vos propres clients et sur les visites répétées. C'est notre principale différence avec les grandes plateformes."], ["Mes clients actuels réservent via le site — je paie pour eux ?", "Non. Il n'y a aucune commission, donc la provenance du client n'a pas d'importance. L'abonnement est le seul frais, et il ne dépend pas du nombre de réservations."], ["Comment fonctionne l'acompte et à qui va-t-il ?", "Le client peut confirmer sa réservation avec un acompte de 10 $. L'acompte va au salon : lors de la visite, il est déduit du prix du service; si le client ne se présente pas, il reste au salon comme compensation pour le créneau. Pour l'instant, l'acompte est noté dans la demande; le paiement en ligne par carte arrive bientôt."], ["Le client ne s'est pas présenté (no-show) — que se passe-t-il ?", "Après l'heure de la visite, le bot vous demandera si le client est venu. Marquez no-show en un clic — c'est visible dans les statistiques, et l'acompte (s'il y en avait un) vous reste. Les clients avec des no-shows répétés se voient restreints sur la plateforme."], ["Comment fermer un jour ou changer l'horaire ?", "Dans le bot : /close 2026-12-25 ferme un jour, /open le rouvre. Même chose dans l'espace salon sur le site, où tout l'horaire hebdomadaire est visible. Les jours fermés et les créneaux occupés disparaissent aussitôt du site."], ["Puis-je partir à tout moment ?", "Oui. Sans pénalités ni conditions cachées : prévenez Booking Club 7 jours à l'avance — nous arrêterons l'abonnement et retirerons le profil de l'annuaire quand vous le demanderez. Start est de toute façon gratuit."], ["Faut-il installer une application ?", "Non. Le salon n'a besoin que de Telegram et d'un navigateur : réservations et gestion — dans le bot et dans l'espace salon sur le site. Les clients n'ont pas besoin d'application non plus."], ["Comment les clients me trouveront-ils ?", "Par l'annuaire et la carte bookingclub.beauty (quatre langues), la recherche par services et par quartier, le concierge IA sur la page d'accueil et la communauté de la diaspora dans Telegram. Partner et Premium apparaissent en plus dans les bandes top et les sélections."], ["Mes données et photos — à qui appartiennent-elles ?", "À vous. Photos, descriptions et prix appartiennent au salon; la plateforme ne fait que les afficher dans l'annuaire. Demandez la suppression — nous retirerons le profil et les matériaux. Détails sur la page des conditions."], ["Comment changer les prix ou les services ?", "Dans l'espace salon sur le site — les prix se mettent à jour sur votre page immédiatement. Services et description — via l'équipe Booking Club en un message, ou par une nouvelle demande au bot. Aucun appel ni des semaines d'attente."]],

  function renderFaq(lang){
    var box = document.getElementById("faqList");
    box.innerHTML = "";
    (T[lang].faq || []).forEach(function(qa){
      var d = document.createElement("details"); d.className = "faq";
      var s = document.createElement("summary"); s.textContent = qa[0];
      var a = document.createElement("div"); a.className = "a"; a.textContent = qa[1];
      d.appendChild(s); d.appendChild(a); box.appendChild(d);
    });
  }
  function applyLang(lang){
    if(!T[lang]) lang = "uk";
    document.documentElement.lang = lang === "uk" ? "uk" : lang;
    try{ localStorage.setItem("bb_lang", lang); }catch(e){}
    document.querySelectorAll("[data-t]").forEach(function(el){
      var k = el.getAttribute("data-t"); var v = T[lang][k];
      if(typeof v === "string") el.innerHTML = v;
    });
    document.querySelectorAll(".langs button").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-lang") === lang);
    });
    renderFaq(lang);
  }
  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){ applyLang(b.getAttribute("data-lang")); });
  });
  var startLang = "uk";
  try{ startLang = localStorage.getItem("bb_lang") || "uk"; }catch(e){}
  applyLang(startLang);

  /* LUXE 2026: reveal-on-scroll */
  (function(){
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var io = ("IntersectionObserver" in window && !reduce) ? new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("lux-in"); io.unobserve(e.target); } });
    }, {threshold:.12}) : null;
    document.querySelectorAll(".stat, .tier, .step, .feat, .faq, .cta, .lead, .rules").forEach(function(el, i){
      el.classList.add("lux-reveal"); el.style.transitionDelay = Math.min(i * 40, 300) + "ms";
      if(io) io.observe(el); else el.classList.add("lux-in");
    });
  })();
  </script>
