<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover" />
  <title>Profile · Beauty Booking Pro</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap">

  <style>
    :root {
      --bg: #07070b;
      --bg-card: rgba(255, 255, 255, 0.03);
      --accent: #ff4fd8;
      --glass: rgba(11, 11, 15, 0.8);
      --stroke: rgba(255, 255, 255, 0.08);
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: var(--bg); color: #fff;
      font-family: 'Inter', sans-serif; padding-bottom: 100px;
    }

    /* 1. DYNAMIC HEADER */
    .nav-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: calc(var(--safe-top) + 10px) 20px 10px;
      display: flex; justify-content: space-between; align-items: center;
      transition: background 0.3s, backdrop-filter 0.3s;
    }
    .nav-header.scrolled {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--stroke);
    }
    .back-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.1); display: flex;
      align-items: center; justify-content: center; text-decoration: none; color: #fff;
    }

    /* 2. PROFILE HERO */
    .profile-hero {
      padding-top: calc(var(--safe-top) + 60px);
      text-align: center;
      background: linear-gradient(to bottom, rgba(255, 79, 216, 0.05) 0%, transparent 100%);
    }
    .avatar-wrapper {
      position: relative; width: 110px; height: 110px; margin: 0 auto 15px;
    }
    #pAvatar {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--accent); padding: 3px;
    }
    .status-badge {
      position: absolute; bottom: 5px; right: 5px;
      width: 20px; height: 20px; background: #22c55e;
      border: 3px solid var(--bg); border-radius: 50%;
    }

    .p-name { font-family: 'Playfair Display'; font-size: 26px; margin: 0; }
    .p-tag { color: var(--accent); font-size: 13px; font-weight: 600; text-transform: uppercase; margin-top: 5px; display: block; }

    /* 3. QUICK ACTIONS */
    .actions-bar {
      display: flex; justify-content: center; gap: 15px; margin: 25px 20px;
    }
    .action-circle {
      width: 50px; height: 50px; border-radius: 18px;
      background: var(--bg-card); border: 1px solid var(--stroke);
      display: flex; align-items: center; justify-content: center;
      color: #fff; text-decoration: none; font-size: 20px;
      transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .action-circle:active { transform: scale(0.9); background: var(--accent); }

    /* 4. GALLERY (Instagram Style) */
    .section-title { font-size: 18px; font-weight: 600; margin: 30px 20px 15px; }
    .gallery-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 0 20px;
    }
    .gallery-item {
      aspect-ratio: 1/1; background: #111; overflow: hidden; border-radius: 8px;
    }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

    /* 5. SERVICES LIST */
    .services-card {
      margin: 20px; background: var(--bg-card); border-radius: 24px;
      border: 1px solid var(--stroke); overflow: hidden;
    }
    .service-row {
      padding: 18px; border-bottom: 1px solid var(--stroke);
      display: flex; justify-content: space-between; align-items: center;
    }
    .service-row:last-child { border-bottom: none; }
    .service-info h4 { margin: 0; font-size: 15px; }
    .service-info span { font-size: 12px; color: rgba(255,255,255,0.4); }
    .price { font-weight: 600; color: var(--accent); }

    /* 6. FLOATING BOOK BUTTON */
    .book-fab {
      position: fixed; bottom: calc(20px + var(--safe-bottom)); left: 20px; right: 20px;
      background: var(--accent); color: #000;
      height: 60px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; text-decoration: none;
      box-shadow: 0 15px 30px var(--accent-glow);
      z-index: 1001;
      animation: fab-pulse 2s infinite;
    }
    @keyframes fab-pulse {
      0% { transform: scale(1); box-shadow: 0 10px 20px rgba(255, 79, 216, 0.4); }
      50% { transform: scale(1.02); box-shadow: 0 15px 30px rgba(255, 79, 216, 0.6); }
      100% { transform: scale(1); box-shadow: 0 10px 20px rgba(255, 79, 216, 0.4); }
    }
  </style>
</head>
<body>

  <header class="nav-header" id="mainHeader">
    <a href="./index.html" class="back-btn" onclick="haptic()">←</a>
    <div style="font-weight:600; opacity:0;" id="headerName">Майстер</div>
    <button class="back-btn" style="background:none; border:none; color:#fff; font-size:20px;">⋮</button>
  </header>

  <div class="profile-hero">
    <div class="avatar-wrapper">
      <img src="" id="pAvatar" alt="Avatar">
      <div class="status-badge"></div>
    </div>
    <h1 class="p-name" id="pName">...</h1>
    <span class="p-tag" id="pCategory">Beauty Expert</span>
    
    <div style="display:flex; justify-content:center; gap:20px; margin-top:15px; font-size:13px; color:rgba(255,255,255,0.5);">
      <span>⭐ <b style="color:#fff" id="pRating">5.0</b> (120+ відгуків)</span>
      <span>📍 <span id="pAddr">...</span></span>
    </div>
  </div>

  <div class="actions-bar">
    <a href="#" class="action-circle" id="callBtn">📞</a>
    <a href="#" class="action-circle" id="igBtn">📸</a>
    <a href="#" class="action-circle" id="mapsBtn">🗺️</a>
    <a href="#" class="action-circle">💬</a>
  </div>

  <div class="section-title">Послуги</div>
  <div class="services-card" id="servicesList">
    </div>

  <div class="section-title">Роботи</div>
  <div class="gallery-grid" id="pGallery">
    <div class="gallery-item"><img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?w=400"></div>
    <div class="gallery-item"><img src="https://images.unsplash.com/photo-1519014816548-bf5fe059798b?w=400"></div>
    <div class="gallery-item"><img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=400"></div>
  </div>

  <a href="#" class="book-fab" id="bookBtn">ЗАПИСАТИСЬ</a>

  <script src="./data.js"></script>
  <script>
    // 1. HAPTIC FEEDBACK
    function haptic() {
      if (window.navigator.vibrate) window.navigator.vibrate(15);
    }

    // 2. SCROLL LOGIC
    window.onscroll = function() {
      const header = document.getElementById('mainHeader');
      const headerName = document.getElementById('headerName');
      if (window.pageYOffset > 50) {
        header.classList.add('scrolled');
        headerName.style.opacity = "1";
      } else {
        header.classList.remove('scrolled');
        headerName.style.opacity = "0";
      }
    };

    // 3. RENDER LOGIC
    function initProfile() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      const l = window.LISTINGS ? window.LISTINGS.find(x => x.id === id) : null;

      if (!l) {
        document.body.innerHTML = "<div style='padding:50px; text-align:center;'>Салон не знайдено</div>";
        return;
      }

      // Наповнюємо дані
      document.getElementById('pName').textContent = l.name;
      document.getElementById('headerName').textContent = l.name;
      document.getElementById('pAvatar').src = l.img || 'https://images.unsplash.com/photo-1560066984-138dadb4c035?w=400';
      document.getElementById('pCategory').textContent = l.category || 'Beauty Studio';
      document.getElementById('pAddr').textContent = l.address;
      document.getElementById('pRating').textContent = l.rating || '5.0';

      // Кнопки дій
      document.getElementById('callBtn').href = `tel:${l.phone || ''}`;
      document.getElementById('igBtn').href = l.instagram || '#';
      document.getElementById('mapsBtn').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.address)}`;

      // Рендер послуг
      const sList = document.getElementById('servicesList');
      if (l.services) {
        sList.innerHTML = l.services.map(s => `
          <div class="service-row">
            <div class="service-info">
              <h4>${s.ua || s.name}</h4>
              <span>${s.duration || '60'} хв</span>
            </div>
            <div class="price">${s.price} ₴</div>
          </div>
        `).join('');
      }

      // Кнопка запису (перехід на індекс з авто-відкриттям модалки)
      document.getElementById('bookBtn').onclick = (e) => {
        e.preventDefault();
        haptic();
        const svcId = (l.services && l.services[0]) ? l.services[0].id : '';
        location.href = `./index.html?book=1&id=${l.id}&service=${svcId}`;
      };
    }

    window.onload = initProfile;
  </script>
</body>
</html>
