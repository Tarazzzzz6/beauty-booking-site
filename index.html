<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BookingClub Montreal</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <style>
        :root {
            --bg: #07070b; --bg-sec: #111118; --bg-card: #161620;
            --accent: #ff4fd8; --text: #f4f3f8; --muted: rgba(244,243,248,0.5);
            --stroke: rgba(255,255,255,0.06); --r: 16px;
        }
        [data-theme="oled"] { --bg: #000; --bg-sec: #080808; --bg-card: #111; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; transition: 0.3s; }
        
        /* HEADER & UTILS */
        header { 
            position: sticky; top: 0; z-index: 1000; background: rgba(7,7,11,0.8); backdrop-filter: blur(20px);
            padding: calc(env(safe-area-inset-top) + 10px) 15px 10px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--stroke);
        }
        .btn-icon { background: var(--bg-sec); border: 1px solid var(--stroke); color: #fff; padding: 8px; border-radius: 12px; cursor: pointer; font-size: 14px; }
        
        /* COMPACT HERO */
        .hero { height: 280px; position: relative; margin: 10px 15px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--stroke); }
        .hero-img { width: 100%; height: 100%; object-fit: cover; }
        .hero-grad { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 10%, transparent 90%); }
        .hero-info { position: absolute; bottom: 15px; left: 15px; }

        /* COMPACT GRID */
        .feed { padding: 10px 15px 120px; display: grid; gap: 20px; }
        .card { background: var(--bg-sec); border-radius: var(--r); overflow: hidden; border: 1px solid var(--stroke); }
        .card-img { height: 180px; position: relative; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 15px; }
        .card-title { font-size: 18px; font-weight: 700; margin: 0 0 5px; }
        .card-meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 12px; }

        /* BOOKING SHEET (The Core) */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; opacity: 0; transition: 0.3s; }
        .sheet { 
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); 
            border-radius: 24px 24px 0 0; z-index: 2001; padding: 25px; 
            transform: translateY(100%); transition: 0.4s cubic-bezier(0.15, 1, 0.3, 1);
            max-height: 85vh; overflow-y: auto;
        }
        .sheet.active { transform: translateY(0); }
        .sheet-overlay.active { display: block; opacity: 1; }

        .time-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
        .time-btn { padding: 10px; background: var(--bg-sec); border: 1px solid var(--stroke); border-radius: 10px; color: #fff; font-size: 13px; text-align: center; }
        .time-btn.active { background: var(--accent); color: #000; font-weight: 700; border-color: var(--accent); }
        .time-btn.disabled { opacity: 0.3; pointer-events: none; }

        .day-scroller { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .day-card { min-width: 60px; padding: 12px; background: var(--bg-sec); border-radius: 12px; text-align: center; border: 1px solid var(--stroke); }
        .day-card.active { border-color: var(--accent); background: rgba(255,79,216,0.1); }
        .day-card b { display: block; font-size: 16px; }
        .day-card span { font-size: 10px; text-transform: uppercase; opacity: 0.6; }

        .btn-confirm { width: 100%; padding: 16px; background: var(--accent); color: #000; border: none; border-radius: 15px; font-weight: 800; margin-top: 25px; }
        
        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(7,7,11,0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 12px 0 calc(15px + env(safe-area-inset-bottom)); border-top: 1px solid var(--stroke); z-index: 1000; }
        .nav-btn { color: var(--muted); text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-btn.active { color: var(--accent); }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div>
            <div id="txt-logo" style="font-weight: 800; font-size: 20px;">BookingClub</div>
            <div style="font-size: 11px; opacity: 0.5;">📍 Montreal, QC</div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn-icon" onclick="toggleLang()">🌐 <span id="lang-val">UA</span></button>
            <button class="btn-icon" onclick="toggleTheme()">🌓</button>
        </div>
    </header>

    <div class="hero">
        <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?w=800" class="hero-img">
        <div class="hero-grad"></div>
        <div class="hero-info">
            <b id="txt-hero">Найкращі майстри Монреаля</b>
        </div>
    </div>

    <main class="feed" id="feed"></main>

    <nav class="nav">
        <a href="#" class="nav-btn active"><span>🏠</span><b id="nav-home">Головна</b></a>
        <a href="#" class="nav-btn"><span>🔍</span><b id="nav-search">Пошук</b></a>
        <a href="./profile.html" class="nav-btn"><span>👤</span><b id="nav-prof">Профіль</b></a>
    </nav>

    <div class="sheet-overlay" id="overlay" onclick="closeBooking()"></div>
    <div class="sheet" id="sheet">
        <div style="width: 40px; height: 4px; background: var(--stroke); border-radius: 10px; margin: -10px auto 20px;"></div>
        <h2 id="sheet-title" style="margin: 0 0 5px;">Забронювати візит</h2>
        <p id="sheet-salon" style="margin: 0 0 20px; color: var(--muted); font-size: 14px;"></p>

        <label style="font-size: 12px; font-weight: 700; opacity: 0.6; text-transform: uppercase;">1. Оберіть дату</label>
        <div class="day-scroller" id="day-picker" style="margin: 10px 0 20px;"></div>

        <label style="font-size: 12px; font-weight: 700; opacity: 0.6; text-transform: uppercase;">2. Вільні вікна</label>
        <div class="time-grid" id="time-picker"></div>

        <button class="btn-confirm" id="btn-submit" onclick="sendBooking()">ПІДТВЕРДИТИ ЗАПИС</button>
    </div>

    <script src="./data.js"></script>
    <script>
        const LOCALE = {
            ua: { home: "Головна", search: "Пошук", prof: "Профіль", hero: "Найкращі майстри Монреаля", confirm: "ПІДТВЕРДИТИ ЗАПИС", success: "Запит надіслано в Telegram!" },
            en: { home: "Home", search: "Search", prof: "Profile", hero: "Montreal's Best Masters", confirm: "CONFIRM BOOKING", success: "Request sent to Telegram!" }
        };

        let currentLang = 'ua';
        let selectedSalon = null;
        let selectedDate = null;
        let selectedTime = null;

        function toggleLang() {
            currentLang = currentLang === 'ua' ? 'en' : 'ua';
            document.getElementById('lang-val').innerText = currentLang.toUpperCase();
            document.getElementById('nav-home').innerText = LOCALE[currentLang].home;
            document.getElementById('nav-search').innerText = LOCALE[currentLang].search;
            document.getElementById('nav-prof').innerText = LOCALE[currentLang].prof;
            document.getElementById('txt-hero').innerText = LOCALE[currentLang].hero;
            document.getElementById('btn-submit').innerText = LOCALE[currentLang].confirm;
        }

        function toggleTheme() {
            const b = document.body;
            b.dataset.theme = b.dataset.theme === 'dark' ? 'oled' : 'dark';
        }

        function renderFeed() {
            const feed = document.getElementById('feed');
            feed.innerHTML = window.LISTINGS.map(l => `
                <div class="card" onclick="openBooking('${l.id}')">
                    <div class="card-img"><img src="${l.img || 'https://via.placeholder.com/400x200'}"></div>
                    <div class="card-body">
                        <div class="card-title">${l.name}</div>
                        <div class="card-meta">
                            <span>⭐ ${l.rating}</span>
                            <span>📍 ${l.address}</span>
                        </div>
                        <div style="font-size:13px; color:var(--accent); font-weight:600;">Від ${l.services[0].price} $</div>
                    </div>
                </div>
            `).join('');
        }

        function openBooking(id) {
            selectedSalon = window.LISTINGS.find(l => l.id === id);
            document.getElementById('sheet-salon').innerText = selectedSalon.name;
            
            // Generate Days
            const picker = document.getElementById('day-picker');
            picker.innerHTML = '';
            for(let i=0; i<7; i++) {
                const d = new Date(); d.setDate(d.getDate() + i);
                const isActive = i === 0 ? 'active' : '';
                if(i===0) selectedDate = d.toISOString().split('T')[0];
                picker.innerHTML += `
                    <div class="day-card ${isActive}" onclick="selectDay(this, '${d.toISOString().split('T')[0]}')">
                        <span>${d.toLocaleDateString(currentLang, {weekday:'short'})}</span>
                        <b>${d.getDate()}</b>
                    </div>
                `;
            }

            renderTimes();
            document.getElementById('sheet').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function renderTimes() {
            const grid = document.getElementById('time-picker');
            const times = ["09:00", "10:30", "12:00", "14:00", "15:30", "17:00", "18:30", "20:00"];
            grid.innerHTML = times.map(t => {
                const isBusy = Math.random() < 0.3;
                return `<div class="time-btn ${isBusy?'disabled':''}" onclick="selectTime(this, '${t}')">${t}</div>`;
            }).join('');
        }

        function selectDay(el, date) {
            document.querySelectorAll('.day-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            selectedDate = date;
            renderTimes();
        }

        function selectTime(el, time) {
            document.querySelectorAll('.time-btn').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            selectedTime = time;
        }

        function closeBooking() {
            document.getElementById('sheet').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        async function sendBooking() {
            if(!selectedTime) return alert("Оберіть час!");
            
            const btn = document.getElementById('btn-submit');
            btn.innerText = "...";
            btn.disabled = true;

            const payload = {
                salon: selectedSalon.name,
                date: selectedDate,
                time: selectedTime,
                service: selectedSalon.services[0].ua,
                client: "User Montreal"
            };

            try {
                // Виклик твого Cloudflare Worker
                await fetch(window.WORKER_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                alert(LOCALE[currentLang].success);
                closeBooking();
            } catch(e) {
                alert("Помилка відправки в TG. Перевірте WORKER_URL.");
            } finally {
                btn.innerText = LOCALE[currentLang].confirm;
                btn.disabled = false;
            }
        }

        window.onload = () => {
            renderFeed();
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('./worker.js');
        };
    </script>
</body>
</html>
