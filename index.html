<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover" />
  <title>Beauty Booking Pro</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap">

  <style>
    :root {
      --bg: #07070b; --bg2: #0d0d14;
      --accent: #ff4fd8; --stroke: rgba(255, 255, 255, 0.08);
      --text: #f4f3f8; --muted: rgba(244, 243, 248, 0.5);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      margin: 0; background: var(--bg); color: var(--text); 
      font-family: 'Inter', sans-serif; overflow-x: hidden;
    }

    /* 1. DYNAMIC HERO SLIDER (Той самий "свап") */
    .hero-wrapper {
      margin: 15px; height: 240px; position: relative;
      border-radius: 28px; overflow: hidden;
      border: 1px solid var(--stroke);
    }
    .hero-slide {
      position: absolute; inset: 0; opacity: 0;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s;
      transform: scale(1.1); background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 25px;
    }
    .hero-slide.active { opacity: 1; transform: scale(1); z-index: 2; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(7,7,11,0.9), transparent); }
    
    .hero-content { position: relative; z-index: 3; }
    .hero-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); margin-bottom: 5px; }
    .hero-title { font-family: 'Playfair Display'; font-size: 26px; margin: 0; line-height: 1.2; }

    /* 2. CATEGORIES (Horizontal Scroll) */
    .pills { display: flex; gap: 10px; overflow-x: auto; padding: 15px 20px; scrollbar-width: none; }
    .pills::-webkit-scrollbar { display: none; }
    .pill { 
      padding: 10px 20px; background: var(--bg2); border: 1px solid var(--stroke); 
      border-radius: 40px; font-size: 13px; white-space: nowrap; transition: 0.3s;
    }
    .pill.active { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); }

    /* 3. FEED CARDS (Як на першому скріні) */
    .feed { padding: 0 15px 120px; }
    .salon-card {
      background: var(--bg2); border-radius: 24px; margin-bottom: 20px;
      overflow: hidden; border: 1px solid var(--stroke);
      animation: slideUp 0.6s ease forwards;
    }
    .card-thumb { position: relative; height: 180px; width: 100%; }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .card-rating {
      position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(5px); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700;
    }

    .card-info { padding: 18px; }
    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; }
    .card-header h3 { margin: 0; font-family: 'Playfair Display'; font-size: 20px; }
    
    .mini-services { border-top: 1px solid var(--stroke); padding-top: 12px; }
    .svc-item { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .svc-item .price { color: var(--accent); font-weight: 600; }

    .quick-book {
      width: 100%; background: #fff; color: #000; border: none; padding: 14px;
      border-radius: 16px; font-weight: 700; font-size: 14px; margin-top: 15px;
    }

    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    /* NAVIGATION */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: rgba(7,7,11,0.9);
      backdrop-filter: blur(20px); border-top: 1px solid var(--stroke);
      display: flex; justify-content: space-around; padding: 12px 10px calc(15px + env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-link { color: var(--muted); text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .nav-link.active { color: var(--accent); }
  </style>
</head>
<body>

  <div class="hero-wrapper" id="heroHost">
    </div>

  <div class="pills">
    <div class="pill active">Усі</div>
    <div class="pill">💅 Манікюр</div>
    <div class="pill">✨ Брови</div>
    <div class="pill">✂️ Стрижки</div>
  </div>

  <main class="feed" id="listingGrid">
    </main>

  <nav class="nav">
    <a href="#" class="nav-link active"><i>🏠</i><span>Головна</span></a>
    <a href="#" class="nav-link"><i>📅</i><span>Записи</span></a>
    <a href="./profile.html" class="nav-link"><i>👤</i><span>Профіль</span></a>
  </nav>

  <script src="./data.js"></script>
  <script>
    // 1. АВТОМАТИЧНА РОТАЦІЯ (Swap Logic)
    let currentHeroIndex = 0;
    function initHeroRotation() {
      const host = document.getElementById('heroHost');
      const tops = window.LISTINGS.slice(0, 5); // Беремо перші 5 для свапу

      host.innerHTML = tops.map((l, i) => `
        <div class="hero-slide ${i === 0 ? 'active' : ''}" style="background-image: url('${l.img}')">
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <div class="hero-label">Рекомендовано</div>
            <h2 class="hero-title">${l.name}</h2>
            <div style="font-size:12px; opacity:0.7; margin-top:5px;">${l.address}</div>
          </div>
        </div>
      `).join('');

      setInterval(() => {
        const slides = document.querySelectorAll('.hero-slide');
        slides[currentHeroIndex].classList.remove('active');
        currentHeroIndex = (currentHeroIndex + 1) % slides.length;
        slides[currentHeroIndex].classList.add('active');
      }, 4000); // 4 секунди на свап
    }

    // 2. РЕНДЕР КАРТОК (Твій стиль)
    function renderFeed() {
      const grid = document.getElementById('listingGrid');
      grid.innerHTML = window.LISTINGS.map(l => `
        <div class="salon-card">
          <div class="card-thumb" onclick="location.href='./profile.html?id=${l.id}'">
            <img src="${l.img}" loading="lazy">
            <div class="card-rating">★ ${l.rating || '5.0'}</div>
          </div>
          <div class="card-info">
            <div class="card-header">
              <h3>${l.name}</h3>
              <div style="font-size:12px; color:var(--muted)">${l.address}</div>
            </div>
            
            <div class="mini-services">
              ${(l.services || []).slice(0, 2).map(s => `
                <div class="svc-item">
                  <span>${s.ua || s.name}</span>
                  <span class="price">${s.price} ₴</span>
                </div>
              `).join('')}
            </div>

            <button class="quick-book" onclick="location.href='./profile.html?id=${l.id}&book=1'">
              ЗАПИСАТИСЬ
            </button>
          </div>
        </div>
      `).join('');
    }

    window.onload = () => {
      initHeroRotation();
      renderFeed();
    };
  </script>
</body>
</html>
