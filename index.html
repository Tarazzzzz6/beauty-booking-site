<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover" />
  <title>Beauty Booking Pro</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap">

  <style>
    :root {
      /* Колірна палітра "Luxury Dark" */
      --bg: #07070b;
      --card-bg: rgba(255, 255, 255, 0.03);
      --accent: #ff4fd8;
      --accent-glow: rgba(255, 79, 216, 0.3);
      --glass: rgba(11, 11, 15, 0.85);
      --stroke: rgba(255, 255, 255, 0.08);
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body {
      margin: 0; background: var(--bg); color: #fff;
      font-family: 'Inter', sans-serif; overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. ПРЕМІАЛЬНИЙ SPLASH SCREEN */
    #splash {
      position: fixed; inset: 0; background: #000; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.8s cubic-bezier(0.65, 0, 0.35, 1);
    }
    .splash-logo {
      font-family: 'Playfair Display'; font-size: 32px; font-weight: 700;
      background: linear-gradient(to bottom, #fff, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: logo-glow 2s ease-in-out infinite alternate;
    }
    @keyframes logo-glow { from { opacity: 0.5; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

    /* 2. ГОЛОВНИЙ HEADER (Fresha Style) */
    .top-header {
      position: sticky; top: 0; z-index: 1000;
      padding: calc(var(--safe-top) + 15px) 20px 15px;
      background: var(--glass); backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--stroke);
      display: flex; justify-content: space-between; align-items: center;
    }

    /* 3. HERO СЕКЦІЯ (Твоя анімована ротація) */
    .hero-container {
      margin: 20px; border-radius: 28px; height: 180px;
      position: relative; overflow: hidden;
      background: #111; border: 1px solid var(--stroke);
    }
    .hero-slide {
      position: absolute; inset: 0; background-size: cover; background-position: center;
      transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.8s;
      display: flex; align-items: flex-end; padding: 20px;
    }

    /* 4. КАТЕГОРІЇ (Pill Buttons з анімацією) */
    .pills-container {
      display: flex; gap: 10px; overflow-x: auto; padding: 0 20px 20px;
      scrollbar-width: none;
    }
    .pills-container::-webkit-scrollbar { display: none; }
    .pill {
      padding: 10px 22px; background: var(--card-bg); border: 1px solid var(--stroke);
      border-radius: 40px; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.6);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      white-space: nowrap;
    }
    .pill.active {
      background: var(--accent); color: #000; border-color: var(--accent);
      box-shadow: 0 10px 20px var(--accent-glow);
    }

    /* 5. КАРТКИ САЛОНІВ (Super Smooth) */
    .listing-grid { padding: 0 20px 120px; display: grid; gap: 20px; }
    .salon-card {
      background: var(--card-bg); border-radius: 32px; border: 1px solid var(--stroke);
      overflow: hidden; opacity: 0; transform: translateY(30px);
      transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .salon-card.reveal { opacity: 1; transform: translateY(0); }
    .salon-card:active { transform: scale(0.96); }

    .card-img { width: 100%; height: 210px; object-fit: cover; }
    .card-body { padding: 18px; }
    .card-title { font-family: 'Playfair Display'; font-size: 20px; margin-bottom: 6px; }
    .card-meta { display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,0.4); }

    /* 6. BOTTOM TAB BAR (Magnetic Effect) */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--glass); backdrop-filter: blur(30px);
      padding: 12px 10px calc(15px + var(--safe-bottom));
      display: flex; justify-content: space-around;
      border-top: 1px solid var(--stroke); z-index: 2000;
    }
    .tab-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: rgba(255,255,255,0.3); font-size: 10px; text-decoration: none;
      transition: 0.3s;
    }
    .tab-item.active { color: var(--accent); }
    .tab-item i { font-size: 22px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .tab-item:active i { transform: scale(1.3); }

    /* БОТТОМ-ШИТ (БРОНЮВАННЯ) */
    .sheet-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
      z-index: 3000; opacity: 0; pointer-events: none; transition: 0.4s;
    }
    .sheet-overlay.active { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; bottom: 0; left: 0; right: 0; background: #0f0f14;
      border-radius: 35px 35px 0 0; padding: 25px;
      transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.3, 0.6, 0, 1);
      z-index: 3001; max-height: 92vh; overflow-y: auto;
    }
    .sheet.active { transform: translateY(0); }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-logo">BeautyFlow</div>
  </div>

  <header class="top-header">
    <div style="font-family:'Playfair Display'; font-size:22px;">BF.</div>
    <div id="geoBtn" style="background:var(--card-bg); padding:8px 15px; border-radius:20px; font-size:12px; border:1px solid var(--stroke);">
      📍 <span id="locLabel">Визначаємо...</span>
    </div>
  </header>

  <div class="hero-container" id="heroHost">
    </div>

  <div class="pills-container" id="catList">
    <div class="pill active">Усі</div>
    <div class="pill">💅 Манікюр</div>
    <div class="pill">✨ Брови</div>
    <div class="pill">💇‍♀️ Волосся</div>
  </div>

  <main class="listing-grid" id="listingGrid">
    </main>

  <nav class="tab-bar">
    <a href="#" class="tab-item active"><i>🏠</i><span>Головна</span></a>
    <a href="#" class="tab-item" id="openBookings"><i>📅</i><span>Записи</span></a>
    <a href="./profile.html" class="tab-item"><i>👤</i><span>Профіль</span></a>
  </nav>

  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="sheet" id="bookingSheet">
    <div style="width:40px; height:5px; background:var(--stroke); border-radius:10px; margin:-10px auto 20px;"></div>
    <div id="bookingContent"></div>
  </div>

  <script src="./data.js"></script>
  <script>
    // 1. ПРИБИРАЄМО SPLASH (після завантаження)
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('splash').style.opacity = '0';
        setTimeout(() => document.getElementById('splash').remove(), 800);
        renderProfessionalGrid();
      }, 1500);
    });

    // 2. HAPTIC FEEDBACK (Топ-фішка)
    function haptic() {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(10);
      }
    }

    // 3. ПРОФЕСІЙНИЙ РЕНДЕР (Staggered Animation)
    function renderProfessionalGrid() {
      const grid = document.getElementById('listingGrid');
      const items = window.LISTINGS || [];
      
      grid.innerHTML = items.map((l, i) => `
        <div class="salon-card" onclick="haptic(); openProBooking('${l.id}')">
          <img src="${l.img}" class="card-img" loading="lazy">
          <div class="card-body">
            <div class="card-title">${l.name}</div>
            <div class="card-meta">
              <span>${l.address}</span>
              <span style="color:#ffd27a">★ ${l.rating || '5.0'}</span>
            </div>
          </div>
        </div>
      `).join('');

      // Запускаємо анімацію появи по черзі
      const cards = document.querySelectorAll('.salon-card');
      cards.forEach((card, idx) => {
        setTimeout(() => card.classList.add('reveal'), idx * 80);
      });
    }

    // 4. ВІДКРИТТЯ БРОНЮВАННЯ (Bottom Sheet)
    function openProBooking(id) {
      const overlay = document.getElementById('sheetOverlay');
      const sheet = document.getElementById('bookingSheet');
      
      overlay.classList.add('active');
      sheet.classList.add('active');
      
      // Твоя логіка з індексу (вибір послуг) йде сюди
      document.getElementById('bookingContent').innerHTML = `
        <h2 style="font-family:'Playfair Display'">Виберіть послугу</h2>
        <div style="padding-bottom:100px;">
          </div>
      `;
    }

    // Закриття по кліку на фон
    document.getElementById('sheetOverlay').onclick = () => {
      document.getElementById('sheetOverlay').classList.remove('active');
      document.getElementById('bookingSheet').classList.remove('active');
    }
  </script>
</body>
</html>
