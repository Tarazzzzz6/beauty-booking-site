<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0b0f"/>
<title>Beauty Booking</title>

<link rel="icon" href="./favicon.svg" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0b0b0f;--bg2:#14141b;--text:#f4f3f8;--muted:rgba(244,243,248,.6);
--pink:#ff4fd8;--gold:#ffd27a;--violet:#8b5cf6;
--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.1);
--stroke:rgba(255,255,255,.08);
--r:20px;--r2:28px;
--shadow:0 20px 80px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
margin:0;font-family:Inter;background:var(--bg);color:var(--text);
-webkit-font-smoothing:antialiased;overflow-x:hidden;
}

/* INTRO */
#intro{
position:fixed;inset:0;z-index:9999;
display:flex;flex-direction:column;align-items:center;justify-content:center;
background:#0b0b0f;
animation:fadeOut 1s ease 2s forwards;
}
#introLogo{
width:78px;height:78px;border-radius:26px;
background:linear-gradient(135deg,var(--pink),var(--violet));
box-shadow:0 0 0 1px rgba(255,255,255,.1),var(--shadow);
position:relative;overflow:hidden;
}
#introLogo:after{
content:"";position:absolute;inset:-40%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
animation:sweep 2s linear infinite;
}
#intro h1{
font-family:Playfair Display;
font-size:34px;margin-top:10px;
background:linear-gradient(90deg,var(--pink),var(--gold));
-webkit-background-clip:text;color:transparent;
opacity:0;animation:fadeUp .6s ease .3s forwards;
}
@keyframes sweep{to{transform:translateX(50%) rotate(20deg)}}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}

/* HEADER */
.top{
position:sticky;top:0;z-index:80;
display:flex;gap:8px;align-items:center;
padding:10px;
background:rgba(10,10,15,.75);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,.05);
}
.search{
flex:1;display:flex;align-items:center;gap:6px;
background:var(--card);
border:1px solid var(--stroke);
border-radius:999px;padding:8px 12px;
}
.search input{flex:1;background:none;border:0;color:var(--text);outline:none}
.icon{padding:8px;border-radius:999px;background:var(--card);border:1px solid var(--stroke)}

/* HERO */
.hero{padding:14px}
.heroCard{
border-radius:var(--r2);
padding:20px;
background:
radial-gradient(800px 400px at 20% 0%,rgba(255,79,216,.15),transparent),
radial-gradient(800px 400px at 80% 0%,rgba(139,92,246,.15),transparent),
var(--card);
border:1px solid var(--stroke);
box-shadow:var(--shadow);
}
.heroTitle{
font-family:Playfair Display;
font-size:32px;margin:0;
}
.heroTitle span{
background:linear-gradient(90deg,var(--pink),var(--gold));
-webkit-background-clip:text;color:transparent;
}
.next{margin-top:10px;font-size:14px;color:var(--muted)}

/* CHIPS */
.chips{display:flex;gap:8px;margin-top:10px;overflow:auto}
.chip{
padding:6px 12px;border-radius:999px;
background:var(--card);border:1px solid var(--stroke);
white-space:nowrap;cursor:pointer;
}

/* SECTIONS */
.section{padding:10px 14px}
.section h3{margin:0 0 8px 0;font-size:18px}

/* GRID */
.grid{display:grid;gap:12px}

/* CARD */
.card{
border-radius:var(--r);
background:var(--card);
border:1px solid var(--stroke);
padding:14px;
position:relative;
transition:.25s;
overflow:hidden;
}
.card:active{transform:scale(.97)}
.card:after{
content:"";position:absolute;inset:-40%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
transform:translateX(-60%) rotate(20deg);
transition:1s;
}
.card:hover:after{transform:translateX(60%) rotate(20deg)}

.badge{
font-size:11px;padding:4px 8px;border-radius:999px;
background:linear-gradient(90deg,var(--pink),var(--gold));
color:black;font-weight:700;
}

.meta{font-size:13px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}

/* FLOAT */
.float{
position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
background:linear-gradient(90deg,var(--pink),var(--gold));
padding:12px 20px;border-radius:999px;font-weight:700;z-index:60;
}

/* MODAL */
.overlay{
position:fixed;inset:0;background:rgba(0,0,0,.6);
display:none;align-items:flex-end;z-index:100;
}
.overlay.on{display:flex}
.sheet{
width:100%;background:var(--bg2);
border-radius:20px 20px 0 0;
padding:14px;max-height:80vh;overflow:auto;
}
input{
width:100%;padding:10px;margin:6px 0;
background:var(--card);border:1px solid var(--stroke);
border-radius:10px;color:white;
}

/* TIME GRID */
.timeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.timeBtn{padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--stroke);text-align:center}

/* EMPTY */
.empty{text-align:center;padding:40px;opacity:.6}
</style>
</head>

<body>

<div id="intro">
<div id="introLogo"></div>
<h1>Beauty Booking</h1>
</div>

<header class="top">
<div class="search"><span>⌕</span><input id="q" placeholder="Пошук..."></div>
<div id="favBtn" class="icon">❤️</div>
<div id="aiBtn" class="icon">✨</div>
</header>

<section class="hero">
<div class="heroCard">
<h2 class="heroTitle">Book beauty in <span>seconds</span></h2>
<div id="next" class="next"></div>
<div class="chips" id="chips"></div>
</div>
</section>

<section class="section">
<h3>Top</h3>
<div id="topGrid" class="grid"></div>
</section>

<section class="section">
<h3>Recommended</h3>
<div id="recGrid" class="grid"></div>
</section>

<section class="section">
<h3>Others</h3>
<div id="allGrid" class="grid"></div>
</section>

<div id="empty" class="empty" style="display:none">Немає результатів</div>

<div class="float" onclick="quick()">⚡ Quick</div>
<script src="./data.js"></script>
<script>
const LS={fav:"bb_fav",draft:"bb_draft"};
let favs=JSON.parse(localStorage.getItem(LS.fav)||"[]");
let favOnly=false;
let activeService=null;

const q=document.getElementById("q");

/* HERO ROTATION */
let h=0;
setInterval(()=>{
const l=window.LISTINGS?.[h%window.LISTINGS.length];
if(l)document.getElementById("next").innerText="Next: "+l.name+" • "+l.address;
h++;
},3000);

/* CHIPS */
function renderChips(){
const box=document.getElementById("chips");
if(!window.SERVICES)return;
box.innerHTML="";
window.SERVICES.forEach(s=>{
const c=document.createElement("div");
c.className="chip";
c.innerText=s.name;
c.onclick=()=>{activeService=s.id;render();};
box.appendChild(c);
});
}

/* CARD HTML */
function cardHTML(l){
const isFav=favs.includes(l.id);
return `
<div style="display:flex;justify-content:space-between">
<b>${l.name}</b>
<span class="badge">${l.rating||"4.8"}★</span>
</div>
<div class="meta">${l.address}</div>
<div style="display:flex;gap:6px;margin:6px 0">
<span class="badge">Today</span>
<span class="badge">Top</span>
</div>
<div class="row">
<button onclick="openBook('${l.id}')">Book</button>
<span onclick="fav('${l.id}')">${isFav?"❤️":"🤍"}</span>
</div>
`;
}

/* RENDER */
function render(){
let data=[...(window.LISTINGS||[])];

const val=q.value.toLowerCase();

data=data.filter(l=>l.name.toLowerCase().includes(val)||l.address.toLowerCase().includes(val));

if(activeService){
data=data.filter(l=>l.services?.includes(activeService));
}

if(favOnly){
data=data.filter(l=>favs.includes(l.id));
}

if(!data.length){
document.getElementById("empty").style.display="block";
return;
}else{
document.getElementById("empty").style.display="none";
}

/* SORT */
data.sort((a,b)=>(b.rating||0)-(a.rating||0));

const top=data.slice(0,3);
const rec=data.slice(3,8);
const all=data.slice(8);

fill("topGrid",top);
fill("recGrid",rec);
fill("allGrid",all);
}

function fill(id,data){
const box=document.getElementById(id);
box.innerHTML="";
data.forEach(l=>{
const el=document.createElement("div");
el.className="card";
el.innerHTML=cardHTML(l);
box.appendChild(el);
});
}

/* FAVORITES */
function fav(id){
if(favs.includes(id))favs=favs.filter(x=>x!==id);
else favs.push(id);
localStorage.setItem(LS.fav,JSON.stringify(favs));
render();
}

document.getElementById("favBtn").onclick=()=>{
favOnly=!favOnly;
render();
};

/* QUICK */
function quick(){
const l=window.LISTINGS?.[0];
if(l)openBook(l.id);
}
  /* BOOKING */
function openBook(id){
window.cur=id;
document.getElementById("modal").classList.add("on");
loadTimes();
}

function loadTimes(){
const grid=document.getElementById("timeGrid");
grid.innerHTML="";
for(let i=9;i<=21;i++){
const t=i+":00";
const b=document.createElement("div");
b.className="timeBtn";
b.innerText=t;
b.onclick=()=>selectTime(t);
grid.appendChild(b);
}
}

function selectTime(t){
document.getElementById("time").value=t;
}

/* CONFIRM */
function confirm(){
fetch("https://snowy-shadow-0b58.irafarm2000.workers.dev/book",{
method:"POST",
body:JSON.stringify({
id:window.cur,
name:document.getElementById("name").value,
phone:document.getElementById("phone").value,
date:document.getElementById("date").value,
time:document.getElementById("time").value
})
});
alert("Sent");
}

/* INIT */
q.oninput=render;
render();
renderChips();

/* SW */
if("serviceWorker" in navigator){
navigator.serviceWorker.register("./worker.js");
}
</script>

</body>
</html>
