      --bg:#06060a;
      --bg2:#0a0a12;

      --line:rgba(255,255,255,.095);
      --text:#f6f4fb;
      --muted:rgba(246,244,251,.72);
      --muted2:rgba(246,244,251,.52);

      --pink:#ff56d6;
      --gold:#ffd27a;
      --violet:#8b5cf6;
      --mint:#63f0c8;

      --r:22px;
      --r2:30px;
      --r3:34px;

      --shadow:0 28px 80px rgba(0,0,0,.58);
      --shadow2:0 14px 36px rgba(0,0,0,.36);
      --shadow3:0 10px 24px rgba(0,0,0,.22);

      --glow:0 0 0 1px rgba(255,255,255,.05), 0 22px 70px rgba(255,79,216,.10);
      --glow2:0 0 0 1px rgba(255,255,255,.08), 0 20px 70px rgba(139,92,246,.10);

      --glassA:rgba(9,9,15,.88);
      --glassB:rgba(9,9,15,.58);
      --glassC:rgba(255,255,255,.06);

      --safe-top:env(safe-area-inset-top);
      --safe-bottom:env(safe-area-inset-bottom);
      --safe-left:env(safe-area-inset-left);
      --safe-right:env(safe-area-inset-right);

      --contentPad:16px;
      --topPad:calc(12px + var(--safe-top));

      --font-title:"Playfair Display", ui-serif, Georgia, serif;
      --font-ui:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    html[data-theme="day"]{
      --bg:#f6f2ff;
      --bg2:#fff8fc;
      --bg3:#fff5fb;
      --card:rgba(10,10,20,.055);
      --card2:rgba(10,10,20,.085);
      --line:rgba(10,10,20,.12);
      --text:#0b0a14;
      --muted:rgba(11,10,20,.72);
      --muted2:rgba(11,10,20,.52);

      --shadow:0 24px 70px rgba(10,10,20,.16);
      --shadow2:0 14px 30px rgba(10,10,20,.12);
      --shadow3:0 10px 20px rgba(10,10,20,.08);

      --glow:0 0 0 1px rgba(10,10,20,.08), 0 18px 60px rgba(255,79,216,.08);
      --glow2:0 0 0 1px rgba(10,10,20,.10), 0 18px 60px rgba(139,92,246,.08);

      --glassA:rgba(255,255,255,.88);
      --glassB:rgba(255,255,255,.62);
      --glassC:rgba(255,255,255,.68);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--text);
      font-family:var(--font-ui);
      text-rendering:optimizeLegibility;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      background:
        radial-gradient(1100px 560px at 8% 0%, rgba(255,86,214,.16), transparent 58%),
        radial-gradient(900px 520px at 92% 6%, rgba(139,92,246,.17), transparent 58%),
        radial-gradient(980px 520px at 50% 100%, rgba(255,210,122,.10), transparent 62%),
        linear-gradient(180deg, var(--bg), var(--bg2) 38%, var(--bg3));
      overflow-x:hidden;
    }

    html[data-theme="day"] body{
      background:
        radial-gradient(1100px 560px at 8% 0%, rgba(255,86,214,.14), transparent 58%),
        radial-gradient(900px 520px at 92% 6%, rgba(139,92,246,.14), transparent 58%),
        radial-gradient(980px 520px at 50% 100%, rgba(255,210,122,.14), transparent 62%),
        linear-gradient(180deg, var(--bg), var(--bg2) 38%, var(--bg3));
    }

    a{color:inherit;text-decoration:none}
    button,input,select{font-family:inherit}
    button{cursor:pointer}
    img{display:block}
    .hidden{display:none !important}
    .muted{color:var(--muted)}
    .sep{height:1px;background:rgba(255,255,255,.06);margin:18px 0}
    html[data-theme="day"] .sep{background:rgba(10,10,20,.10)}

    .launch{
      position:fixed;
      inset:0;
      z-index:220;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:calc(20px + var(--safe-top)) calc(20px + var(--safe-right)) calc(20px + var(--safe-bottom)) calc(20px + var(--safe-left));
      background:
        radial-gradient(900px 420px at 18% 8%, rgba(255,86,214,.22), transparent 58%),
        radial-gradient(760px 420px at 88% 12%, rgba(139,92,246,.20), transparent 60%),
        radial-gradient(860px 500px at 50% 100%, rgba(255,210,122,.14), transparent 65%),
        linear-gradient(180deg, #050509, #090911 68%, #0b0b14);
      opacity:1;
      visibility:visible;
      transition:opacity .55s ease, visibility .55s ease;
    }
    html[data-theme="day"] .launch{
      background:
        radial-gradient(900px 420px at 18% 8%, rgba(255,86,214,.16), transparent 58%),
        radial-gradient(760px 420px at 88% 12%, rgba(139,92,246,.14), transparent 60%),
        radial-gradient(860px 500px at 50% 100%, rgba(255,210,122,.14), transparent 65%),
        linear-gradient(180deg, #f7f3ff, #fff8fc);
    }
    .launch.hide{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }
    .launchInner{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
      text-align:center;
      animation:launchFade 1s ease;
    }
    @keyframes launchFade{
      from{opacity:0;transform:translateY(10px) scale(.985)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }
    .launchLogo{
      width:82px;
      height:82px;
      border-radius:26px;
      background:
        radial-gradient(22px 22px at 30% 25%, rgba(255,255,255,.44), transparent 60%),
        linear-gradient(135deg, var(--pink), var(--gold), var(--violet));
      box-shadow:
        0 20px 70px rgba(255,86,214,.34),
        0 0 0 1px rgba(255,255,255,.14),
        inset 0 1px 0 rgba(255,255,255,.16);
      position:relative;
      overflow:hidden;
    }
    .launchLogo:after{
      content:"";
      position:absolute;
      inset:-40%;
      background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.34), transparent 60%);
      transform:rotate(20deg);
    }
    .launchTitle{
      font-family:var(--font-title);
      font-size:30px;
      font-weight:700;
      letter-spacing:.28px;
    }
    .launchGlow{
      width:180px;
      height:4px;
      border-radius:999px;
      background:linear-gradient(90deg,var(--pink),var(--gold),var(--violet));
      animation:launchGlow 1.4s ease infinite;
      box-shadow:0 0 30px rgba(255,86,214,.35);
    }
    @keyframes launchGlow{
      0%{opacity:.35;transform:scaleX(.62)}
      50%{opacity:1;transform:scaleX(1)}
      100%{opacity:.35;transform:scaleX(.62)}
    }

    .netbar{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      top:calc(10px + var(--safe-top));
      z-index:160;
      width:min(860px,calc(100% - 24px));
      padding:10px 12px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(10,10,16,.84);
      backdrop-filter:blur(14px);
      box-shadow:0 22px 70px rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    html[data-theme="day"] .netbar{
      border-color:rgba(10,10,20,.12);
      background:rgba(255,255,255,.88);
      box-shadow:0 20px 60px rgba(10,10,20,.15);
    }
    .netbar.show{display:flex}
    .netbar .txt{font-size:13px;color:var(--text)}
    .netbar .btns{display:flex;gap:8px;flex-wrap:wrap}
    .nb{
      height:36px;
      padding:0 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.05);
      color:var(--text);
      font-weight:700;
    }
    html[data-theme="day"] .nb{
      border-color:rgba(10,10,20,.12);
      background:rgba(255,255,255,.72);
    }
    .nb.primary{
      background:rgba(99,240,200,.16);
      border-color:rgba(99,240,200,.26);
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:70;
      padding:var(--topPad) calc(var(--contentPad) + var(--safe-right)) 8px calc(var(--contentPad) + var(--safe-left));
      backdrop-filter:blur(18px);
      background:
        linear-gradient(180deg, var(--glassA), var(--glassB));
      border-bottom:1px solid rgba(255,255,255,.05);
    }
    html[data-theme="day"] .topbar{
      border-bottom-color:rgba(10,10,20,.08);
    }

    .topbarRow{
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top:6px;
    }
    body.is-standalone .topbarRow{margin-top:12px}

    .brandShell{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
      position:relative;
    }
    .brandShell:before{
      content:"";
      position:absolute;
      inset:auto auto -8px -18px;
      width:120px;
      height:54px;
      border-radius:999px;
      background:radial-gradient(circle, rgba(255,86,214,.18), transparent 68%);
      filter:blur(18px);
      pointer-events:none;
    }
    html[data-theme="day"] .brandShell:before{
      background:radial-gradient(circle, rgba(255,86,214,.12), transparent 68%);
    }

    .logo{
      width:48px;
      height:48px;
      border-radius:17px;
      flex:0 0 auto;
      background:
        radial-gradient(18px 18px at 30% 25%, rgba(255,255,255,.38), transparent 60%),
        linear-gradient(135deg, rgba(255,86,214,.96), rgba(255,210,122,.86), rgba(139,92,246,.90));
      box-shadow:
        0 12px 40px rgba(255,86,214,.20),
        0 0 0 1px rgba(255,255,255,.10),
        inset 0 1px 0 rgba(255,255,255,.12);
      position:relative;
      overflow:hidden;
    }
    .logo:after{
      content:"";
      position:absolute;
      inset:-40%;
      background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.25), transparent 56%);
      transform:rotate(25deg);
    }

    .brandText{
      display:flex;
      flex-direction:column;
      min-width:0;
      line-height:1.02;
    }
    .brandText .name{
      font-family:var(--font-title);
      font-size:24px;
      font-weight:700;
      letter-spacing:.16px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .brandText .sub{
      margin-top:3px;
      color:var(--muted2);
      font-size:12.5px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    <script>

/* ===== helpers ===== */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function safeText(el,val){
  if(!el) return;
  el.textContent = val ?? "";
}

function safeHTML(el,val){
  if(!el) return;
  el.innerHTML = val ?? "";
}

/* ===== theme ===== */

const themeBtn=$("#themeBtn");

themeBtn.onclick=()=>{
  const t=document.documentElement.dataset.theme==="night"?"day":"night";
  document.documentElement.dataset.theme=t;
  localStorage.setItem("bb-theme",t);
}

const savedTheme=localStorage.getItem("bb-theme");
if(savedTheme) document.documentElement.dataset.theme=savedTheme;


/* ===== language ===== */

const langBtn=$("#langBtn");
let lang="ua";

langBtn.onclick=()=>{
  lang=lang==="ua"?"en":"ua";
  langBtn.textContent=lang==="ua"?"🌐":"EN";
}

/* ===== favorites filter ===== */

const favBtn=$("#favBtn");

favBtn.onclick=()=>{
  favBtn.classList.toggle("active");
  renderListings();
}

/* ===== services chips ===== */

$$(".chip").forEach(ch=>{
  ch.onclick=()=>{
    $$(".chip").forEach(c=>c.classList.remove("active"));
    ch.classList.add("active");
    renderListings(ch.dataset.service);
  }
})


/* ===== render salons ===== */

function renderListings(service){

const wrap=$("#listings");

if(!wrap) return;

wrap.innerHTML="";

const data=window.LISTINGS || [];

let arr=[...data];

if(service){
  arr=arr.filter(s=>s.services?.some(x=>x.id===service));
}

if(favBtn.classList.contains("active")){
  arr=arr.filter(x=>localStorage.getItem("fav-"+x.id));
}

arr.forEach(s=>{

const card=document.createElement("div");
card.className="card";

card.innerHTML=`

<img src="${s.images?.[0]||''}">

<div class="cardBody">

<div class="cardTitle">
${s.name}
<span class="rating">${s.rating||"4.9"} ★</span>
</div>

<div class="cardAddr">
${s.address||""}
</div>

<div class="cardActions">

<button onclick="openProfile('${s.id}')">
🏛 Профіль
</button>

<button class="bookBtn" onclick="quickBook('${s.id}')">
⚡ Запис
</button>

</div>

</div>

`;

wrap.appendChild(card);

});

}


/* ===== profile open ===== */

function openProfile(id){
  location.href=`profile.html?id=${id}`;
}


/* ===== booking ===== */

function quickBook(id){

const s=window.LISTINGS.find(x=>x.id===id);

if(!s) return;

$("#bookModal").classList.add("show");

safeText($("#bookSalon"),s.name);
safeText($("#bookAddr"),s.address);

$("#bookSubmit").onclick=()=>{
sendBooking(s);
};

}


/* ===== send booking ===== */

async function sendBooking(salon){

const name=$("#bookName").value;
const phone=$("#bookPhone").value;

if(!name||!phone){
  alert("Заповни дані");
  return;
}

const payload={
name,
phone,
salon:salon.name,
address:salon.address
};

try{

await fetch("https://snowy-shadow-0b58.irafarm2000.workers.dev/book",{
method:"POST",
headers:{'content-type':'application/json'},
body:JSON.stringify(payload)
});

alert("Запис відправлено");

$("#bookModal").classList.remove("show");

}catch(e){

alert("Помилка відправки");

}

}


/* ===== next slot rotation ===== */

let slotIndex=0;

function rotateSlot(){

const arr=window.LISTINGS||[];

if(!arr.length) return;

slotIndex++;

if(slotIndex>=arr.length) slotIndex=0;

const s=arr[slotIndex];

safeText($("#slotName"),s.name);
safeText($("#slotAddr"),s.address);

}

setInterval(rotateSlot,10000);


/* ===== launch screen ===== */

window.addEventListener("load",()=>{

setTimeout(()=>{

const l=$("#launch");

if(l) l.classList.add("hide");

},1100);

});


/* ===== PWA ===== */

if("serviceWorker" in navigator){

navigator.serviceWorker.register("./worker.js");

}


/* ===== init ===== */

function init(){

renderListings();

rotateSlot();

}

init();

</script>
