<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BookingClub PRO</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap">

  <style>
    :root {
      --bg: #07070b; --bg2: #0d0d14;
      --accent: #ff4fd8; --stroke: rgba(255, 255, 255, 0.08);
      --text: #f4f3f8; --muted: rgba(244, 243, 248, 0.5);
      --r: 24px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { 
      margin: 0; background: var(--bg); color: var(--text); 
      font-family: 'Inter', sans-serif; overflow-x: hidden;
      -webkit-user-select: none; user-select: none;
    }

    /* 1. FRESH HEADER (Glassmorphism) */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(7, 7, 11, 0.8); backdrop-filter: blur(20px);
      padding: calc(env(safe-area-inset-top) + 15px) 20px 15px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--stroke);
    }

    /* 2. TOP SWAPPER (Hero) */
    .hero-container {
      margin: 15px; height: 260px; position: relative;
      border-radius: var(--r); overflow: hidden;
      border: 1px solid var(--stroke);
    }
    .hero-slide {
      position: absolute; inset: 0; opacity: 0;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s;
      transform: scale(1.1); background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 25px;
    }
    .hero-slide.active { opacity: 1; transform: scale(1); z-index: 2; }
    .hero-gradient { position: absolute; inset: 0; background: linear-gradient(to top, rgba(7,7,11,0.95), transparent); }
    .hero-info { position: relative; z-index: 3; }
    .hero-tag { font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; }
    .hero-name { font-family: 'Playfair Display'; font-size: 28px; margin: 0; line-height: 1.1; }

    /* 3. CATEGORIES (Sticky & Dynamic) */
    .pills {
      display: flex; gap: 10px; overflow-x: auto; padding: 10px 20px;
      scrollbar-width: none; position: sticky; top: 72px; z-index: 99;
      background: var(--bg);
    }
    .pills::-webkit-scrollbar { display: none; }
    .pill {
      padding: 10px 22px; background: var(--bg2); border: 1px solid var(--stroke);
      border-radius: 40px; font-size: 13px; white-space: nowrap; transition: 0.3s;
      cursor: pointer;
    }
    .pill.active { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); box-shadow: 0 0 15px var(--accent); }

    /* 4. SALON CARDS (Fresha Style) */
    .feed { padding: 10px 15px 120px; }
    .card {
      background: var(--bg2); border-radius: var(--r); margin-bottom: 25px;
      overflow: hidden; border: 1px solid var(--stroke);
      transition: 0.3s;
    }
    .card:active { transform: scale(0.97); }
    .card-img { position: relative; height: 210px; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    
    /* Live Status Pulse */
    .badge-live {
      position: absolute; top: 15px; left: 15px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
      padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; gap: 6px;
    }
    .dot { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .card-body { padding: 20px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
    .card-header h3 { margin: 0; font-family: 'Playfair Display'; font-size: 22px; }
    .rating { font-weight: 700; color: #ffd27a; font-size: 14px; }

    /* Services List (Screen 1 style) */
    .svc-list { border-top: 1px solid var(--stroke); padding-top: 15px; display: flex; flex-direction: column; gap: 8px; }
    .svc-row { display: flex; justify-content: space-between; font-size: 14px; }
    .svc-name { color: var(--muted); }
    .svc-price { font-weight: 600; color: var(--accent); }

    .btn-main {
      width: 100%; background: #fff; color: #000; border: none; padding: 16px;
      border-radius: 18px; font-weight: 700; font-size: 15px; margin-top: 20px;
      cursor: pointer;
    }

    /* 5. NAVIGATION */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: rgba(7,7,11,0.92);
      backdrop-filter: blur(25px); border-top: 1px solid var(--stroke);
      display: flex; justify-content: space-around; padding: 12px 10px calc(15px + env(safe-area-inset-bottom));
      z-index: 1000;
    }
    .nav-btn { color: var(--muted); text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn i { font-size: 22px; font-style: normal; }
  </style>
</head>
<body>

  <header>
    <div style="font-family:'Playfair Display'; font-size:24px; font-weight:700;">BookingClub</div>
    <div onclick="haptic()" style="background:var(--bg2); padding:8px 15px; border-radius:15px; font-size:13px; border:1px solid var(--stroke);">📍 Київ</div>
  </header>

  <div class="hero-container" id="heroHost">
    </div>

  <div class="pills">
    <div class="pill active" onclick="filterCat('all', this)">✨ Усі</div>
    <div class="pill" onclick="filterCat('manicure', this)">💅 Манікюр</div>
    <div class="pill" onclick="filterCat('brows', this)">👁️ Брови</div>
    <div class="pill" onclick="filterCat('hair', this)">💇‍♀️ Волосся</div>
  </div>

  <main class="feed" id="listingGrid">
    </main>

  <nav class="nav">
    <a href="#" class="nav-btn active"><i>🏠</i><span>Стрічка</span></a>
    <a href="#" class="nav-btn"><i>🔍</i><span>Пошук</span></a>
    <a href="#" class="nav-btn"><i>📅</i><span>Записи</span></a>
    <a href="./profile.html" class="nav-btn"><i>👤</i><span>Профіль</span></a>
  </nav>

  <script src="./data.js"></script>

  <script>
    // ⚡️ ТИХА ВІБРАЦІЯ
    const haptic = () => { if(navigator.vibrate) navigator.vibrate(10); };

    // 1. АВТО-СВАП (ЛОГІКА 2026)
    let heroIdx = 0;
    function startHeroSwap() {
      const tops = window.LISTINGS.slice(0, 4);
      const host = document.getElementById('heroHost');
      
      host.innerHTML = tops.map((l, i) => `
        <div class="hero-slide ${i === 0 ? 'active' : ''}" style="background-image:url('${l.img}')">
          <div class="hero-gradient"></div>
          <div class="hero-info">
            <div class="hero-tag">Найкращий вибір</div>
            <h2 class="hero-name">${l.name}</h2>
            <div style="font-size:13px; opacity:0.6; margin-top:5px;">📍 ${l.address}</div>
          </div>
        </div>
      `).join('');

      setInterval(() => {
        const slides = document.querySelectorAll('.hero-slide');
        if(!slides.length) return;
        slides[heroIdx].classList.remove('active');
        heroIdx = (heroIdx + 1) % slides.length;
        slides[heroIdx].classList.add('active');
      }, 4000);
    }

    // 2. РЕНДЕР КАРТОК (FRESHA STYLE)
    function renderCards(data = window.LISTINGS) {
      const grid = document.getElementById('listingGrid');
      grid.innerHTML = data.map(l => `
        <div class="card" onclick="haptic(); location.href='./profile.html?id=${l.id}'">
          <div class="card-img">
            <img src="${l.img}" loading="lazy">
            <div class="badge-live"><span class="dot"></span> Online</div>
          </div>
          <div class="card-body">
            <div class="card-header">
              <h3>${l.name}</h3>
              <div class="rating">★ ${l.rating}</div>
            </div>
            
            <div class="svc-list">
              ${(l.services || []).slice(0, 2).map(s => `
                <div class="svc-row">
                  <span class="svc-name">${s.ua || s.name}</span>
                  <span class="svc-price">${s.price} ₴</span>
                </div>
              `).join('')}
            </div>

            <button class="btn-main" onclick="event.stopPropagation(); location.href='./profile.html?id=${l.id}&book=1'">
              ЗАБРОНЮВАТИ
            </button>
          </div>
        </div>
      `).join('');
    }

    // 3. ФІЛЬТРАЦІЯ
    function filterCat(id, el) {
      haptic();
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      
      const filtered = id === 'all' 
        ? window.LISTINGS 
        : window.LISTINGS.filter(l => (l.services || []).some(s => s.serviceId === id));
      
      renderCards(filtered);
    }

    window.onload = () => {
      startHeroSwap();
      renderCards();
      
      // Реєстрація воркера
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./worker.js');
      }
    };
  </script>
</body>
</html>
