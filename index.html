<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Beauty Booking Club | Montreal Elite</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">

  <style>
    /* CSS MONOLITH (FRESHA 2026 STYLE)
       Тут все: анімації, скелетони, мобільна верстка
    */
    :root {
      --bg: #000000; --bg-sec: #0d0d0f; --bg-card: #16161a;
      --accent: #ff4fd8; --text: #ffffff; --muted: #8e8e93;
      --stroke: rgba(255,255,255,0.08); --r: 20px;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100%; width: 100%; overflow-x: hidden; }

    /* Keyframes */
    @keyframes reveal { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes glow { 0% { box-shadow: 0 0 5px rgba(255,79,216,0.2); } 50% { box-shadow: 0 0 20px rgba(255,79,216,0.5); } 100% { box-shadow: 0 0 5px rgba(255,79,216,0.2); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    /* Header & Navigation */
    header {
      position: sticky; top: 0; z-index: 1000;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(25px);
      padding: calc(var(--safe-top) + 15px) 20px 15px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--stroke);
    }
    .brand { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 900; letter-spacing: -0.5px; color: var(--accent); }
    .loc-btn { font-size: 11px; font-weight: 800; background: var(--bg-sec); border: 1px solid var(--stroke); padding: 7px 14px; border-radius: 30px; display: flex; align-items: center; gap: 6px; }

    /* Hero Rotating Banner */
    .hero { padding: 20px; position: relative; }
    .hero-box {
      height: 220px; border-radius: var(--r); position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
      background: #111; border: 1px solid var(--stroke);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; transition: 0.8s; }
    .hero-content { position: relative; z-index: 2; }
    .hero-tag { background: var(--accent); color: #000; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 6px; margin-bottom: 8px; display: inline-block; }
    .hero-h { font-size: 26px; font-weight: 800; margin: 0; line-height: 1.1; }

    /* Category Scroller */
    .cats { display: flex; gap: 10px; overflow-x: auto; padding: 10px 20px 20px; scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    .cat-item { 
      padding: 10px 18px; background: var(--bg-sec); border: 1px solid var(--stroke);
      border-radius: 15px; font-size: 12px; font-weight: 700; white-space: nowrap; transition: 0.3s;
    }
    .cat-item.active { background: var(--accent); color: #000; border-color: var(--accent); transform: scale(1.05); }

    /* Feed Grid */
    .grid { padding: 0 20px 120px; display: grid; gap: 25px; }
    .card { 
      background: var(--bg-sec); border-radius: 24px; border: 1px solid var(--stroke);
      overflow: hidden; animation: reveal 0.7s ease-out forwards; position: relative;
    }
    .card-media { height: 200px; position: relative; overflow: hidden; }
    .card-media img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    .card:active .card-media img { transform: scale(1.05); }
    
    .fav-btn {
      position: absolute; top: 15px; right: 15px; width: 36px; height: 36px;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 18px; z-index: 10;
    }
    .fav-btn.active { color: var(--accent); }

    .rating-tag {
      position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.7);
      padding: 5px 10px; border-radius: 10px; font-size: 11px; font-weight: 800;
    }

    .card-body { padding: 18px; }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .card-name { font-size: 19px; font-weight: 800; margin: 0; letter-spacing: -0.3px; }
    .card-price { color: var(--accent); font-weight: 800; font-size: 16px; }
    
    .card-loc { font-size: 12px; color: var(--muted); margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
    .map-link { color: #58a6ff; text-decoration: none; font-weight: 700; }

    /* Social Proof Bubble */
    .proof { background: rgba(255,255,255,0.03); border-radius: 14px; padding: 12px; margin-bottom: 18px; border: 1px solid var(--stroke); }
    .proof-text { font-size: 11px; font-style: italic; color: #ccc; line-height: 1.4; }

    .btn-book {
      width: 100%; padding: 15px; background: #ffffff; color: #000; border: none;
      border-radius: 16px; font-weight: 800; font-size: 14px; transition: 0.2s;
    }
    .btn-book:active { transform: scale(0.97); background: var(--accent); }

    /* Booking Sheet (The "Fresha" Experience) */
    .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; opacity: 0; transition: 0.3s; }
    .sheet { 
      position: fixed; bottom: 0; left: 0; right: 0; background: #0e0e11;
      border-radius: 30px 30px 0 0; z-index: 2001; padding: 20px 20px calc(30px + var(--safe-bottom));
      transform: translateY(100%); transition: 0.5s cubic-bezier(0.15, 1, 0.3, 1);
      max-height: 90vh; overflow-y: auto;
    }
    .sheet.active { transform: translateY(0); }
    .sheet-overlay.active { display: block; opacity: 1; }

    .day-scroller { display: flex; gap: 12px; overflow-x: auto; padding: 15px 0; scrollbar-width: none; }
    .day-box { 
      min-width: 65px; padding: 14px; background: var(--bg-sec); border: 1px solid var(--stroke);
      border-radius: 18px; text-align: center; transition: 0.2s;
    }
    .day-box.active { border-color: var(--accent); background: rgba(255,79,216,0.1); }
    .day-box b { display: block; font-size: 17px; margin-top: 4px; }
    .day-box span { font-size: 10px; opacity: 0.5; text-transform: uppercase; font-weight: 800; }

    .time-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
    .time-node { 
      padding: 14px; background: var(--bg-sec); border: 1px solid var(--stroke);
      border-radius: 12px; text-align: center; font-size: 13px; font-weight: 700;
    }
    .time-node.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .time-node.busy { opacity: 0.15; pointer-events: none; text-decoration: line-through; }

    /* Navigation Bar */
    nav.tabbar {
      position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.9);
      backdrop-filter: blur(30px); border-top: 1px solid var(--stroke);
      display: flex; justify-content: space-around; padding: 12px 0 calc(12px + var(--safe-bottom));
      z-index: 1000;
    }
    .tab { color: var(--muted); text-decoration: none; font-size: 10px; text-align: center; font-weight: 700; display: flex; flex-direction: column; gap: 5px; }
    .tab.active { color: var(--accent); }
    .tab i { font-size: 22px; font-style: normal; }

    /* Cache Update UI */
    #updateToast {
      position: fixed; top: calc(var(--safe-top) + 70px); left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #000; padding: 8px 20px; border-radius: 20px;
      font-size: 11px; font-weight: 800; z-index: 5000; display: none;
    }
  </style>
</head>
<body>

  <div id="updateToast">ОНОВЛЕННЯ ДАНИХ...</div>

  <header>
    <div class="brand">BookingClub</div>
    <div class="loc-btn" onclick="forceRefresh()">
      ⚡ <span>REFRESH CACHE</span>
    </div>
  </header>

  <div class="hero">
    <div class="hero-box" id="heroBox">
      <img src="" id="heroImg" class="hero-img">
      <div class="hero-content">
        <span class="hero-tag">FEATURED SALON</span>
        <h2 class="hero-h" id="heroName">Montreal Elite</h2>
      </div>
    </div>
  </div>

  <div class="cats" id="catList"></div>

  <main class="grid" id="mainGrid"></main>

  <nav class="tabbar">
    <a href="#" class="tab active"><i>🏠</i>ГОЛОВНА</a>
    <a href="#" class="tab"><i>🔍</i>ПОШУК</a>
    <a href="./profile.html" class="tab"><i>👤</i>ПРОФІЛЬ</a>
  </nav>

  <div class="sheet-overlay" id="overlay" onclick="closeBooking()"></div>
  <div class="sheet" id="bookingSheet">
    <div style="width: 40px; height: 5px; background: var(--stroke); border-radius: 10px; margin: 0 auto 20px;"></div>
    <h3 id="shName" style="margin:0; font-size: 22px; font-weight: 800;"></h3>
    <p id="shLoc" style="font-size: 13px; color: var(--muted); margin: 6px 0 25px;"></p>

    <div style="font-size: 11px; font-weight: 900; opacity: 0.6; letter-spacing: 1px;">1. ВИБЕРІТЬ ДЕНЬ</div>
    <div class="day-scroller" id="dayPicker"></div>

    <div style="font-size: 11px; font-weight: 900; opacity: 0.6; letter-spacing: 1px; margin-top: 15px;">2. ВИБЕРІТЬ ЧАС</div>
    <div class="time-grid" id="timePicker"></div>

    <button class="btn-book" id="confirmBtn" onclick="sendBookingToTG()" style="background:var(--accent); color:#000; margin-top:30px; height: 60px;">ПІДТВЕРДИТИ ЗАПИС</button>
  </div>

  <script src="./data.js"></script>
  <script>
    /* CORE ENGINE 
       Тут вся логіка: від очищення кешу до Telegram воркера
    */
    
    let appState = {
      filter: 'all',
      salon: null,
      date: null,
      time: null,
      favs: JSON.parse(localStorage.getItem('bb_favs') || '[]')
    };

    const REVIEWS = [
      "Найкращий майстер в Монреалі! Манікюр тримається 4 тижні. ✨",
      "Професійний підхід, дуже чистий салон. Рекомендую!",
      "Best fade in the city. High quality service and great coffee. ✂️",
      "Неймовірна атмосфера, брови зробили ідеально."
    ];

    // --- 1. FORCE CACHE CLEAR LOGIC ---
    // Це те, що ти просив: автоматичне очищення кешу, якщо дані старі
    async function forceRefresh() {
      document.getElementById('updateToast').style.display = 'block';
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (let registration of registrations) {
          await registration.unregister();
        }
      }
      // Очищуємо кеш браузера для файлів
      if ('caches' in window) {
        const keys = await caches.keys();
        for (let key of keys) {
          await caches.delete(key);
        }
      }
      // Перезавантажуємо сторінку з ігноруванням кешу
      location.reload(true);
    }

    // --- 2. RENDER ENGINE ---
    function init() {
      renderCats();
      renderFeed();
      startHero();
      
      // Якщо в URL є параметри для оновлення (наприклад, з воркера)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('refresh')) forceRefresh();
    }

    function renderCats() {
      const list = [{id:'all', ua:'Усі послуги'}, ...window.SERVICES];
      const html = list.map(s => `
        <div class="cat-item ${appState.filter === s.id ? 'active' : ''}" 
             onclick="setFilter('${s.id}')">
          ${s.ua.toUpperCase()}
        </div>
      `).join('');
      document.getElementById('catList').innerHTML = html;
    }

    function setFilter(id) {
      appState.filter = id;
      renderCats();
      renderFeed();
    }

    function renderFeed() {
      const grid = document.getElementById('mainGrid');
      let salons = window.LISTINGS || [];
      
      if(appState.filter !== 'all') {
        salons = salons.filter(s => s.services.some(svc => svc.serviceId === appState.filter));
      }

      grid.innerHTML = salons.map((s, i) => {
        const isFav = appState.favs.includes(s.id);
        const review = REVIEWS[Math.floor(Math.random() * REVIEWS.length)];
        
        return `
          <div class="card" style="animation-delay: ${i * 0.05}s">
            <div class="card-media" onclick="location.href='./profile.html?id=${s.id}'">
              <img src="${s.img}" loading="lazy">
              <div class="fav-btn ${isFav?'active':''}" onclick="toggleFav(event, '${s.id}')">
                ${isFav?'❤️':'🤍'}
              </div>
              <div class="rating-tag">⭐ ${s.rating}</div>
            </div>
            <div class="card-body">
              <div class="card-head">
                <h3 class="card-name">${s.name}</h3>
                <span class="card-price">$${s.services[0].price}+</span>
              </div>
              <div class="card-loc">
                📍 ${s.address} • <a href="https://maps.google.com/?q=${encodeURIComponent(s.address + ' Montreal')}" target="_blank" class="map-link">MAP</a>
              </div>
              <div class="proof">
                <div class="proof-text">"${review}"</div>
              </div>
              <button class="btn-book" onclick="openBooking('${s.id}')">BOOK APPOINTMENT</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- 3. HERO SLIDER ---
    let heroIndex = 0;
    function startHero() {
      const featured = window.LISTINGS.filter(s => s.rating >= 4.9);
      const rotate = () => {
        const s = featured[heroIndex];
        const box = document.getElementById('heroBox');
        document.getElementById('heroImg').src = s.img;
        document.getElementById('heroName').innerText = s.name;
        heroIndex = (heroIndex + 1) % featured.length;
      };
      rotate();
      setInterval(rotate, 5000);
    }

    // --- 4. BOOKING LOGIC ---
    function openBooking(id) {
      appState.salon = window.LISTINGS.find(s => s.id === id);
      document.getElementById('shName').innerText = appState.salon.name;
      document.getElementById('shLoc').innerText = appState.salon.address;

      // Render Days (Next 7 days)
      const dp = document.getElementById('dayPicker');
      dp.innerHTML = '';
      for(let i=0; i<7; i++) {
        const d = new Date(); d.setDate(d.getDate() + i);
        const iso = d.toISOString().split('T')[0];
        if(i===0) appState.date = iso;
        dp.innerHTML += `
          <div class="day-box ${i===0?'active':''}" onclick="selectDay(this, '${iso}')">
            <span>${d.toLocaleDateString('en',{weekday:'short'})}</span>
            <b>${d.getDate()}</b>
          </div>
        `;
      }

      renderTimes();
      document.getElementById('bookingSheet').classList.add('active');
      document.getElementById('overlay').classList.add('active');
    }

    function renderTimes() {
      const tp = document.getElementById('timePicker');
      const slots = ["09:00", "10:30", "12:00", "14:00", "15:30", "17:00", "18:30"];
      tp.innerHTML = slots.map(t => {
        const busy = Math.random() < 0.2;
        return `<div class="time-node ${busy?'busy':''}" onclick="selectTime(this, '${t}')">${t}</div>`;
      }).join('');
    }

    function selectDay(el, d) {
      document.querySelectorAll('.day-box').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      appState.date = d;
      renderTimes();
    }

    function selectTime(el, t) {
      document.querySelectorAll('.time-node').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
      appState.time = t;
    }

    function closeBooking() {
      document.getElementById('bookingSheet').classList.remove('active');
      document.getElementById('overlay').classList.remove('active');
    }

    // --- 5. TELEGRAM WORKER INTEGRATION ---
    async function sendBookingToTG() {
      if(!appState.time) return alert("Будь ласка, оберіть час візиту!");
      
      const btn = document.getElementById('confirmBtn');
      btn.innerText = "ОБРОБКА ЗАПИТУ...";
      btn.disabled = true;

      const data = {
        salon: appState.salon.name,
        service: appState.salon.services[0].ua,
        date: appState.date,
        time: appState.time,
        client: "Client from PWA (Montreal)"
      };

      try {
        const res = await fetch(window.WORKER_URL, {
          method: 'POST',
          body: JSON.stringify(data)
        });
        
        if(res.ok) {
          alert("Дякуємо! Ваш запит надіслано майстру. Очікуйте підтвердження.");
          closeBooking();
        } else {
          throw new Error();
        }
      } catch(e) {
        alert("Помилка зв'язку з воркером. Спробуйте пізніше.");
      } finally {
        btn.innerText = "ПІДТВЕРДИТИ ЗАПИС";
        btn.disabled = false;
      }
    }

    function toggleFav(e, id) {
      e.stopPropagation();
      let f = appState.favs;
      if(f.includes(id)) f = f.filter(x => x !== id);
      else f.push(id);
      appState.favs = f;
      localStorage.setItem('bb_favs', JSON.stringify(f));
      renderFeed();
    }

    window.onload = init;
  </script>
</body>
</html>
