<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Beauty Booking Pro</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap">

  <style>
    :root {
      --bg: #07070b; --bg-card: rgba(255,255,255,0.04);
      --accent: #ff4fd8; --accent-glow: rgba(255,79,216,0.3);
      --text: #f4f3f8; --stroke: rgba(255,255,255,0.08);
      --glass: rgba(11,11,15,0.85);
    }

    /* 1. SKELETON ANIMATION */
    @keyframes shimmer { 0% { opacity: 0.5; } 50% { opacity: 0.8; } 100% { opacity: 0.5; } }
    .skeleton { background: var(--bg-card); animation: shimmer 1.5s infinite; border-radius: 18px; }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      margin: 0; background: var(--bg); color: var(--text); 
      font-family: 'Inter', sans-serif; overflow-x: hidden;
      transition: background 0.5s ease; /* Пункт 19: Плавна тема */
    }

    /* 2. DYNAMIC GLASS HEADER (Пункт 6) */
    .header {
      position: sticky; top: 0; z-index: 1000; padding: calc(env(safe-area-inset-top) + 15px) 20px 15px;
      background: transparent; transition: 0.3s;
    }
    .header.scrolled { background: var(--glass); backdrop-filter: blur(25px); border-bottom: 1px solid var(--stroke); }

    /* 3. HERO SLIDER (Пункт 8) */
    .hero {
      margin: 10px 20px 25px; height: 180px; border-radius: 28px;
      overflow: hidden; position: relative; border: 1px solid var(--stroke);
    }
    .hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }

    /* 4. SMART SEARCH (Пункт 16) */
    .search-box {
      margin: 0 20px 20px; position: relative;
    }
    .search-input {
      width: 100%; background: var(--bg-card); border: 1px solid var(--stroke);
      padding: 16px 16px 16px 45px; border-radius: 20px; color: #fff;
      font-size: 15px; transition: 0.3s;
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }

    /* 5. STAGGERED GRID (Пункт 7) */
    .grid { padding: 0 20px 120px; display: grid; gap: 20px; }
    .card {
      background: var(--bg-card); border-radius: 32px; border: 1px solid var(--stroke);
      overflow: hidden; opacity: 0; transform: translateY(30px);
      transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .card.visible { opacity: 1; transform: translateY(0); }
    .card:active { transform: scale(0.96); } /* Пункт 10: Micro-interaction */

    /* 6. BADGES (Пункт 13) */
    .badge {
      position: absolute; top: 15px; left: 15px; padding: 4px 10px;
      border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase;
      background: var(--accent); color: #000;
    }

    /* 7. BOTTOM SHEET (UX King) */
    .sheet-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
      z-index: 2000; display: none; opacity: 0; transition: 0.3s;
    }
    .sheet {
      position: fixed; bottom: 0; left: 0; right: 0; background: #0f0f15;
      border-radius: 35px 35px 0 0; padding: 25px; z-index: 2001;
      transform: translateY(100%); transition: 0.5s cubic-bezier(0.3, 0.6, 0, 1);
    }
    .sheet.active { transform: translateY(0); }
    .sheet-overlay.active { display: block; opacity: 1; }

    /* 8. PWA INSTALL PROMPT (Пункт 18) */
    #pwaPrompt {
      position: fixed; bottom: 100px; left: 20px; right: 20px;
      background: var(--accent); color: #000; padding: 15px;
      border-radius: 20px; display: none; font-weight: 600; text-align: center;
      z-index: 1500; animation: fadeInUp 0.5s both;
    }
  </style>
</head>
<body>

  <div id="appLoader" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; align-items:center; justify-content:center;">
    <div class="skeleton" style="width:60px; height:60px; border-radius:50%;"></div>
  </div>

  <header class="header" id="mainHeader">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1 style="font-family:'Playfair Display'; margin:0; font-size:24px;">BeautyPro</h1>
      <div id="themeToggle" onclick="toggleTheme()" style="cursor:pointer; font-size:20px;">🌙</div>
    </div>
  </header>

  <div class="hero">
    <video class="hero-video" autoplay muted loop playsinline>
      <source src="https://player.vimeo.com/external/371433846.sd.mp4?s=231ed099f6916568853b925b3997e324f92ed49e&profile_id=139&oauth2_token_id=57447761" type="video/mp4">
    </video>
    <div style="position:relative; padding:25px; height:100%; display:flex; flex-direction:column; justify-content:center;">
      <h2 style="margin:0; font-family:'Playfair Display'; font-size:28px;">Твій ідеальний образ</h2>
      <p style="font-size:14px; opacity:0.8;">Бронюй за 30 секунд</p>
    </div>
  </div>

  <div class="search-box">
    <span style="position:absolute; left:18px; top:16px; opacity:0.4;">🔍</span>
    <input type="text" class="search-input" id="smartSearch" placeholder="Манікюр, стрижка або салон..." oninput="handleSearch()">
  </div>

  <div id="recentSection" style="display:none; padding:0 20px 20px;">
    <p style="font-size:12px; opacity:0.5; margin-bottom:10px;">ВИ НЕДАВНО ДИВИЛИСЬ</p>
    <div id="recentList" style="display:flex; gap:10px; overflow-x:auto;"></div>
  </div>

  <main class="grid" id="listingGrid">
    <div class="skeleton" style="height:280px;"></div>
    <div class="skeleton" style="height:280px;"></div>
  </main>

  <div id="pwaPrompt" onclick="installPWA()">Додати BeautyPro на головний екран ✨</div>

  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="sheet" id="bookingSheet">
    <div style="width:40px; height:5px; background:var(--stroke); border-radius:10px; margin:-10px auto 20px;"></div>
    <div id="bookingContent"></div>
  </div>

  <script src="./data.js"></script>
  <script>
    // --- ГЛОБАЛЬНИЙ СТАН ---
    const state = {
      theme: localStorage.getItem('theme') || 'dark',
      history: JSON.parse(localStorage.getItem('searchHistory') || '[]'),
      recent: JSON.parse(localStorage.getItem('recentList') || '[]')
    };

    // 1. HAPTIC FEEDBACK (Пункт 3)
    const haptic = () => { if(navigator.vibrate) navigator.vibrate(12); };

    // 2. ТЕМА (Пункт 19)
    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', state.theme);
      applyTheme();
      haptic();
    }
    function applyTheme() {
      document.body.setAttribute('data-theme', state.theme);
      document.getElementById('themeToggle').textContent = state.theme === 'dark' ? '🌙' : '☀️';
    }

    // 3. RENDER З АНІМАЦІЄЮ (Пункт 7, 13)
    function renderApp(items = window.LISTINGS) {
      const grid = document.getElementById('listingGrid');
      if(!items.length) {
        grid.innerHTML = `<div style="text-align:center; padding:50px; opacity:0.5;">Нічого не знайдено 🔍</div>`;
        return;
      }

      grid.innerHTML = items.map((l, i) => `
        <div class="card" onclick="openBooking('${l.id}')">
          <div style="position:relative">
            <img src="${l.img}" style="width:100%; height:200px; object-fit:cover;">
            ${l.rating > 4.8 ? '<div class="badge">Top Rated</div>' : ''}
          </div>
          <div style="padding:18px;">
            <div style="display:flex; justify-content:space-between; align-items:start;">
              <h3 style="margin:0; font-family:'Playfair Display';">${l.name}</h3>
              <span style="color:var(--accent); font-weight:700;">★ ${l.rating}</span>
            </div>
            <p style="font-size:13px; opacity:0.6; margin:5px 0 0;">📍 ${l.address}</p>
          </div>
        </div>
      `).join('');

      // Поступова поява (Staggered)
      setTimeout(() => {
        document.querySelectorAll('.card').forEach((c, i) => {
          setTimeout(() => c.classList.add('visible'), i * 100);
        });
      }, 50);
    }

    // 4. SMART SEARCH (Пункт 16)
    function handleSearch() {
      const val = document.getElementById('smartSearch').value;
      const filtered = window.LISTINGS.filter(l => 
        l.name.toLowerCase().includes(val.toLowerCase()) || 
        l.address.toLowerCase().includes(val.toLowerCase())
      );
      renderApp(filtered);
    }

    // 5. OFFLINE QUEUE (Пункт 17)
    window.addEventListener('online', () => {
      const pending = JSON.parse(localStorage.getItem('pendingBookings') || '[]');
      if(pending.length) {
        console.log("Відправка відкладених записів...");
        // Тут логіка відправки
      }
    });

    // SCRROLL EFFECT (Пункт 6)
    window.onscroll = () => {
      const h = document.getElementById('mainHeader');
      window.scrollY > 30 ? h.classList.add('scrolled') : h.classList.remove('scrolled');
    };

    // INITIALIZE
    window.onload = () => {
      applyTheme();
      setTimeout(() => {
        document.getElementById('appLoader').style.opacity = '0';
        setTimeout(() => document.getElementById('appLoader').remove(), 500);
        renderApp();
      }, 1000);
    };

    // PWA Prompt logic
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwaPrompt').style.display = 'block';
    });

    function installPWA() {
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      document.getElementById('pwaPrompt').style.display = 'none';
    }
  </script>
</body>
</html>
